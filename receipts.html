<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#1F3A5F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Receipts</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #F6F4EE; --card: #FFFFFF; --ink: #1B1F26; --muted: #6B7280; --line: #E4E1D8;
      --navy: #1F3A5F; --navy-soft: #E6ECF5; --amber: #B7791F; --amber-soft: #FBF1DC;
      --red: #B23A3A; --green: #2E7D4F; --green-soft: #E3F2E9; --radius: 14px;
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.4; overscroll-behavior-y: none; }
    body { min-height: 100vh; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }
    .app { min-height: 100vh; padding-bottom: calc(100px + var(--safe-b)); }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(10px + var(--safe-t)) 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .topbar h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px 0 calc(6px + var(--safe-b)); }
    .tabbar button { flex: 1; background: none; border: none; padding: 6px 0; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .tabbar button.on { color: var(--navy); font-weight: 600; }
    .tabbar .ico { font-size: 20px; line-height: 1; }
    .fab { position: fixed; right: 18px; bottom: calc(24px + var(--safe-b)); z-index: 31; width: 62px; height: 62px; border-radius: 31px; background: var(--navy); color: #fff; border: none; font-size: 28px; box-shadow: 0 6px 18px rgba(31,58,95,0.35); display: flex; align-items: center; justify-content: center; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 0 12px 10px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: var(--navy-soft); color: var(--navy); border: 1px solid transparent; white-space: nowrap; }
    .chip.tag { background: var(--green-soft); color: var(--green); }
    .chip.warn { background: var(--amber-soft); color: var(--amber); }
    .chip.btn { background: var(--card); border-color: var(--line); color: var(--ink); }
    .chip.btn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .thumb { width: 54px; height: 68px; object-fit: cover; border-radius: 8px; background: #eee; border: 1px solid var(--line); flex-shrink: 0; }
    .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 16px; font-weight: 600; }
    .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn.danger { color: var(--red); border-color: #E7C9C9; }
    .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
    .btn.wide { width: 100%; }
    .btn:disabled { opacity: 0.45; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 16px; }
    .field textarea { min-height: 72px; resize: vertical; }
    .field.unsure input, .field.unsure select { border-color: var(--amber); background: var(--amber-soft); }
    .field.unsure { background: var(--amber-soft); margin-left: -8px; margin-right: -8px; padding: 6px 8px; border-radius: 10px; }
    .unsure-note { font-size: 12px; color: var(--amber); margin-top: 4px; }
    .section-h { padding: 14px 16px 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between; }
    .empty { text-align: center; color: var(--muted); padding: 60px 24px; }
    .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 15px; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 8px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .flabel { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; align-self: center; min-width: 64px; flex-shrink: 0; }
    .sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-bottom: calc(24px + var(--safe-b)); }
    .sheet .topbar { background: var(--bg); }
    .pages { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .pages img { height: 120px; border-radius: 8px; border: 1px solid var(--line); }
    .pages .add { height: 120px; width: 90px; border-radius: 8px; border: 1px dashed var(--muted); background: none; color: var(--muted); font-size: 13px; }
    .banner { margin: 0 12px 10px; padding: 10px 14px; border-radius: 12px; font-size: 13px; }
    .banner.err { background: #FBE5E5; color: var(--red); }
    .banner.ok { background: var(--green-soft); color: var(--green); }
    .banner.info { background: var(--navy-soft); color: var(--navy); }
    .spinner { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .spinner.dark { border-color: rgba(31,58,95,0.2); border-top-color: var(--navy); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes focusPulse { 0% { transform: scale(1.3); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; }
    .kv .k { color: var(--muted); }
    .total-line { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; color: var(--muted); }
    .crop-wrap { position: relative; touch-action: none; user-select: none; }
    .crop-wrap img { display: block; width: 100%; height: auto; }
    .handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 22px; background: rgba(255,255,255,0.15); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.4); }
    .handle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 5px; background: #fff; }
    .handle { transform-origin: center; touch-action: none; }
    .handle.edge { width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 8px; background: rgba(255,255,255,0.1); }
    .handle.edge::after { width: 14px; height: 4px; margin: -2px 0 0 -7px; border-radius: 2px; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { flex: 1; border: none; background: var(--card); padding: 9px; font-size: 13px; }
    .seg button.on { background: var(--navy); color: #fff; }
    .sync-dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
  </style>

  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const BUILD_VERSION = '2026-09-06g-import-compress';
    const DEFAULT_CATEGORIES = ['Electronics', 'Bills'];
    const DEFAULT_TAGS = ['Warranty', 'Reimbursable'];
    const CATEGORY_COLOURS = ['#1F3A5F', '#2E7D4F', '#B7791F', '#7B4FA1', '#B23A3A', '#2A7F8F', '#8A6D3B', '#4C5B7A'];

    // ---------- Settings (localStorage) ----------
    const SKEY = 'receipts_settings';
    const loadSettings = () => {
      const base = { apiKey: '', categories: DEFAULT_CATEGORIES.slice(), tags: DEFAULT_TAGS.slice(), currency: 'AUD', enhanceDefault: true, driveConnected: false, driveFolderId: '', lastSync: null, notDuplicates: [], cameraDevice: '' };
      try { const s = JSON.parse(localStorage.getItem(SKEY) || '{}'); return { ...base, ...s }; } catch (_) { return base; }
    };
    const saveSettings = (s) => { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (_) {} };

    // ---------- IndexedDB ----------
    const DB_NAME = 'receipts_db', DB_VER = 1;
    let dbPromise = null;
    const openDB = () => {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
      return dbPromise;
    };
    const tx = async (store, mode, fn) => {
      const db = await openDB();
      return new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const s = t.objectStore(store);
        let out;
        try { out = fn(s); } catch (e) { rej(e); return; }
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    };
    const dbGetAll = (store) => tx(store, 'readonly', (s) => s.getAll());
    const dbGet = (store, id) => tx(store, 'readonly', (s) => s.get(id));
    const dbPut = (store, obj) => tx(store, 'readwrite', (s) => s.put(obj));
    const dbDel = (store, id) => tx(store, 'readwrite', (s) => s.delete(id));
    const dbGetImageBlob = async (id) => { const r = await dbGet('images', id); return r ? r.blob : null; };

    const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const fmtDate = (iso) => { if (!iso) return ''; const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : iso; };
    const fmtMoney = (n, cur) => { if (n === null || n === undefined || n === '' || isNaN(+n)) return ''; const v = (+n).toFixed(2); return (cur === 'AUD' || !cur ? '$' : cur + ' ') + v; };
    const parseDate = (txt) => {
      const t = String(txt || '').trim(); if (!t) return null;
      let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = t.match(/^(\d{1,2})[\/.\-\s](\d{1,2})(?:[\/.\-\s](\d{2,4}))?$/);
      if (!m) { const d = t.match(/^(\d{2})(\d{2})(\d{4})$/); if (d) m = [null, d[1], d[2], d[3]]; else { const e = t.match(/^(\d{2})(\d{2})(\d{2})$/); if (e) m = [null, e[1], e[2], e[3]]; } }
      if (!m) return null;
      let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
      const mo = +m[2], d = +m[1]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    };
    const gstOf = (total) => { const t = +total; return isNaN(t) ? null : Math.round(t / 11 * 100) / 100; };
    const monthLabel = (iso) => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? 'Unknown date' : d.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }); };
    const catColour = (cat, cats) => { const i = Math.max(0, cats.indexOf(cat)); return CATEGORY_COLOURS[i % CATEGORY_COLOURS.length]; };

    // ---------- Image helpers ----------
    const loadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('could not decode image')); im.src = src; });
    const blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
    const canvasToBlob = (c, q = 0.86) => new Promise((res) => c.toBlob(res, 'image/jpeg', q));
    const fileToCanvas = async (file, maxDim = 2000) => {
      let bmp = null;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) {}
      let src = bmp, w, h;
      if (bmp) { w = bmp.width; h = bmp.height; }
      else { const url = URL.createObjectURL(file); src = await loadImage(url); w = src.naturalWidth; h = src.naturalHeight; URL.revokeObjectURL(url); }
      const scale = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      if (bmp && bmp.close) bmp.close();
      return c;
    };
    const scaleCanvas = (src, maxDim, q = 0.8) => {
      const scale = Math.min(1, maxDim / Math.max(src.width, src.height));
      const c = document.createElement('canvas');
      c.width = Math.round(src.width * scale); c.height = Math.round(src.height * scale);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', q);
    };
    const blobToCanvas = async (blob, maxDim) => fileToCanvas(blob, maxDim);

    // ---------- Edge detection: gradient-weighted Hough on a downscaled grey image ----------
    // Returns { quad: [4 corners in full-res coords] | null, lines: [{rho, theta, score, kind}] in full-res coords }
    const detectReceipt = (canvas) => {
      const W = canvas.width, H = canvas.height;
      const sc = Math.min(1, 560 / Math.max(W, H));
      const w = Math.max(8, Math.round(W * sc)), h = Math.max(8, Math.round(H * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.drawImage(canvas, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      // Channels: luminance, R, G, B, saturation. Paper on a white desk often differs only in tint or in a soft shadow.
      const nCh = 5; const ch = []; for (let k = 0; k < nCh; k++) ch.push(new Float32Array(w * h));
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        const r = d[i], g = d[i + 1], b = d[i + 2]; const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        ch[0][j] = 0.299 * r + 0.587 * g + 0.114 * b; ch[1][j] = r; ch[2][j] = g; ch[3][j] = b; ch[4][j] = mx ? (mx - mn) / mx * 255 : 0;
      }
      // 3x3 box blur with edge replication, so the image border does not become a fake edge
      const blur = (src) => { const o = new Float32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0; for (let dy = -1; dy <= 1; dy++) { const yy = Math.min(h - 1, Math.max(0, y + dy)); for (let dx = -1; dx <= 1; dx++) { const xx = Math.min(w - 1, Math.max(0, x + dx)); s += src[yy * w + xx]; } } o[y * w + x] = s / 9; } return o; };
      const mag = new Float32Array(w * h), ang = new Float32Array(w * h);
      let maxMag = 0;
      for (let k = 0; k < nCh; k++) {
        const gb = blur(ch[k]); const wgt = k === 0 ? 1 : k === 4 ? 1.2 : 0.8;
        for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const gx = (gb[i - w + 1] + 2 * gb[i + 1] + gb[i + w + 1]) - (gb[i - w - 1] + 2 * gb[i - 1] + gb[i + w - 1]);
          const gy = (gb[i + w - 1] + 2 * gb[i + w] + gb[i + w + 1]) - (gb[i - w - 1] + 2 * gb[i - w] + gb[i - w + 1]);
          const m = Math.hypot(gx, gy) * wgt;
          if (m > mag[i]) { mag[i] = m; ang[i] = Math.atan2(gy, gx); }
        }
      }
      {
        const coarse = blur(blur(blur(ch[0]))); const cs = blur(blur(blur(ch[4])));
        for (let y = 2; y < h - 2; y++) for (let x = 2; x < w - 2; x++) {
          const i = y * w + x;
          const gx = (coarse[i - w + 2] + 2 * coarse[i + 2] + coarse[i + w + 2]) - (coarse[i - w - 2] + 2 * coarse[i - 2] + coarse[i + w - 2]);
          const gy = (coarse[i + w - 2] + 2 * coarse[i + w] + coarse[i + w + 2]) - (coarse[i - w - 2] + 2 * coarse[i - w] + coarse[i - w + 2]);
          const sx = (cs[i - w + 2] + 2 * cs[i + 2] + cs[i + w + 2]) - (cs[i - w - 2] + 2 * cs[i - 2] + cs[i + w - 2]);
          const sy = (cs[i + w - 2] + 2 * cs[i + w] + cs[i + w + 2]) - (cs[i - w - 2] + 2 * cs[i - w] + cs[i - w + 2]);
          let m = Math.hypot(gx, gy) * 2.2, a = Math.atan2(gy, gx);
          const ms = Math.hypot(sx, sy) * 2.6; if (ms > m) { m = ms; a = Math.atan2(sy, sx); }
          if (m > mag[i]) { mag[i] = m; ang[i] = a; }
        }
      }
      for (let i = 0; i < mag.length; i++) if (mag[i] > maxMag) maxMag = mag[i];
      // Threshold: the top ~14% of magnitudes, but never above an absolute level, so a faint paper edge on a pale desk still votes
      const hist = new Int32Array(256); const hs = 255 / (maxMag || 1);
      for (let i = 0; i < mag.length; i++) hist[Math.min(255, Math.round(mag[i] * hs))]++;
      let acc = 0, thr = 255; const want = mag.length * 0.14;
      for (let b = 255; b >= 0; b--) { acc += hist[b]; if (acc >= want) { thr = b / hs; break; } }
      thr = Math.max(12, Math.min(thr, 48));
      const weak = thr;
      // Hough: theta 0..179 (degrees), normal-form rho = x cos + y sin
      const D = Math.ceil(Math.hypot(w, h)); const nR = 2 * D + 1; const nT = 180;
      const A = new Float32Array(nT * nR);
      const cosT = new Float32Array(nT), sinT = new Float32Array(nT);
      for (let t = 0; t < nT; t++) { cosT[t] = Math.cos(t * Math.PI / 180); sinT[t] = Math.sin(t * Math.PI / 180); }
      for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
        const i = y * w + x; if (mag[i] < thr) continue;
        const vote = 0.5 + 0.5 * Math.sqrt(Math.min(1, mag[i] / (maxMag * 0.35)));
        let phi = Math.round(ang[i] * 180 / Math.PI); // normal direction of the edge
        if (phi < 0) phi += 180; if (phi >= 180) phi -= 180;
        for (let dt = -6; dt <= 6; dt++) {
          let t = phi + dt; if (t < 0) t += 180; if (t >= 180) t -= 180;
          const r = Math.round(x * cosT[t] + y * sinT[t]) + D;
          if (r >= 0 && r < nR) A[t * nR + r] += vote;
        }
      }
      // gather peaks, non-max suppression
      const isHoriz = (t) => Math.abs(t - 90) <= 28;           // normal near vertical => line near horizontal
      const isVert = (t) => t <= 28 || t >= 152;
      const cells = [];
      const minVotes = Math.max(12, Math.round(Math.min(w, h) * 0.12));
      for (let t = 0; t < nT; t++) { if (!isHoriz(t) && !isVert(t)) continue; for (let r = 0; r < nR; r++) { const v = A[t * nR + r]; if (v >= minVotes) cells.push({ t, r, v }); } }
      cells.sort((a, b) => b.v - a.v);
      const peaks = [];
      for (const cnd of cells) {
        if (peaks.length > 140) break;
        let ok = true;
        for (const p of peaks) { const dt = Math.min(Math.abs(p.t - cnd.t), 180 - Math.abs(p.t - cnd.t)); if (dt <= 4 && Math.abs(p.r - cnd.r) <= Math.max(6, Math.min(w, h) * 0.03)) { ok = false; break; } }
        if (ok) peaks.push(cnd);
      }
      const cx = w / 2, cy = h / 2;
      const support = (theta, rho) => {
        // sample along the line inside the image; an aligned edge within 2px counts
        const ct = Math.cos(theta), stt = Math.sin(theta); const dx = -stt, dy = ct;
        const px = rho * ct, py = rho * stt; // nearest point to origin
        const span = Math.hypot(w, h); let n = 0, hit = 0, run = 0, bestRun = 0;

      const tapFocus = async (e) => {
        if (pinch.current.moved) return;

        const cx = e.clientX - rect.left, cy = e.clientY - rect.top;

          const caps = track.getCapabilities ? track.getCapabilities() : {}; const advanced = [];

      const capture = async () => {
        if (!videoRef.current || !ready || busy) return;
        setBusy(true);
        try {
          const v = videoRef.current; const track = streamRef.current && streamRef.current.getVideoTracks()[0];

          if (track && window.ImageCapture) {
            try {
              const ic = new ImageCapture(track); let opts = {};
              try { const pc = await ic.getPhotoCapabilities(); if (pc.imageWidth && pc.imageHeight) opts = { imageWidth: pc.imageWidth.max, imageHeight: pc.imageHeight.max }; } catch (_) {}
              let blob = null; try { blob = await ic.takePhoto(opts); } catch (_) { try { blob = await ic.takePhoto(); } catch (__) {} }

        <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 60, display: 'flex', flexDirection: 'column' }}>
          {err ? (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', padding: 24, textAlign: 'center', gap: 16 }}>

            </div>

            <>
              <div style={{ flex: 1, position: 'relative', overflow: 'hidden', touchAction: 'none' }} onClick={tapFocus} onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} onPointerCancel={onPU}>
                <video ref={videoRef} playsInline muted autoPlay style={{ width: '100%', height: '100%', objectFit: 'contain', background: '#000' }} />
                {!ready && <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 14 }}>Starting camera...</div>}
                {busy && <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.35)', color: '#fff' }}>Capturing...</div>}
                {reticle && <div style={{ position: 'absolute', left: reticle.x - 30, top: reticle.y - 30, width: 60, height: 60, border: '2px solid #fff', borderRadius: 4, pointerEvents: 'none', animation: 'focusPulse 0.9s ease-out forwards' }} />}
                <div style={{ position: 'absolute', top: 'calc(10px + var(--safe-t))', left: 12, right: 12, display: 'flex', justifyContent: 'space-between', color: '#fff', fontSize: 12, opacity: 0.85, pointerEvents: 'none' }}><span>Page {pageNo}</span><span>{res}</span></div>
                {zoomCaps && <div style={{ position: 'absolute', right: 12, bottom: 34, background: 'rgba(0,0,0,0.5)', color: '#fff', borderRadius: 14, padding: '4px 10px', fontSize: 12, pointerEvents: 'none' }}>{zoom.toFixed(1)}x</div>}
                {ready && <div style={{ position: 'absolute', bottom: 12, left: 0, right: 0, textAlign: 'center', color: '#fff', opacity: 0.6, fontSize: 11, pointerEvents: 'none' }}>{zoomCaps ? 'Pinch to zoom' : 'Zoom not supported on this lens'}{canTapFocus ? ' · tap to focus' : ''}</div>}
              </div>
              {zoomCaps && <div style={{ background: '#000', padding: '4px 20px 0' }}><input type="range" min={zoomCaps.min} max={zoomCaps.max} step={zoomCaps.step || 0.1} value={zoom} onChange={e => applyZoom(+e.target.value)} style={{ width: '100%' }} /></div>}

                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, minWidth: 74 }}>
                  <button onClick={() => { stopStream(); onCancel(); }} style={{ background: 'transparent', color: '#fff', border: 'none', fontSize: 15, padding: '8px 0', textAlign: 'left' }}>Cancel</button>
                  <label style={{ color: '#fff', fontSize: 12, opacity: 0.8 }}>Gallery<input type="file" accept="image/*" hidden onChange={e => { if (e.target.files[0]) { stopStream(); onPick(e.target.files[0]); } }} /></label>
                </div>
                <button onClick={capture} disabled={!ready || busy} style={{ width: 72, height: 72, borderRadius: 36, background: '#fff', border: '4px solid rgba(255,255,255,0.4)', opacity: ready && !busy ? 1 : 0.4 }} />

                  {cams.length > 1 && <button onClick={switchCam} disabled={busy} style={{ background: 'rgba(255,255,255,0.15)', color: '#fff', border: 'none', borderRadius: 18, padding: '8px 12px', fontSize: 12 }}>Lens {camIdx + 1}/{cams.length}</button>}

                </div>
              </div>
            </>

        </div>
      );
    }

    // ---------- Crop editor: pinch-zoom, draggable corners and edges, snap to detected lines ----------
    function CropEditor({ canvas, onDone, onRetake, enhanceDefault }) {

          return q.map((pt, k) => k === a ? cl(na) : k === b ? cl(nb) : pt);

      };

      const apply = () => {
        setBusy(true);
        setTimeout(() => {
          try {
            const colour = warpQuad(canvas, quad, 2800);
            const enhanced = enhanceCanvas(colour);
            setResult({ colour, enhanced, colourUrl: scaleCanvas(colour, 1600, 0.82), enhancedUrl: scaleCanvas(enhanced, 1600, 0.82) });
          } finally { setBusy(false); }
        }, 30);
      };
      const finish = async () => { setBusy(true); const c = enhance ? result.enhanced : result.colour; const blob = await canvasToBlob(c, 0.88); onDone(blob, enhance); };
      if (!preview) return <div className="sheet" style={{ background: '#000' }} />;
      const dims = `${canvas.width}x${canvas.height}${canvas.captureHow === 'photo' ? ' still' : ''}`;
      if (result) return (
        <div className="sheet" style={{ background: '#111', color: '#fff', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: 'calc(8px + var(--safe-t)) 16px 4px', fontSize: 12, opacity: 0.7, textAlign: 'center' }}>{(enhance ? result.enhanced : result.colour).width}x{(enhance ? result.enhanced : result.colour).height} · pinch to zoom</div>
          <ZoomPane style={{ flex: 1 }}>
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 12 }}>
              <img src={enhance ? result.enhancedUrl : result.colourUrl} draggable={false} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', borderRadius: 6 }} />
            </div>
          </ZoomPane>
          <div style={{ padding: '10px 16px calc(20px + var(--safe-b))', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div className="seg" style={{ borderColor: '#444' }}>
              <button style={{ background: enhance ? '#fff' : '#222', color: enhance ? '#000' : '#fff' }} onClick={() => setEnhance(true)}>Enhanced</button>
              <button style={{ background: !enhance ? '#fff' : '#222', color: !enhance ? '#000' : '#fff' }} onClick={() => setEnhance(false)}>Colour</button>

      );

      const mids = quad ? quad.map((p, i) => { const n = quad[(i + 1) % 4]; return { x: (p.x + n.x) / 2, y: (p.y + n.y) / 2 }; }) : [];
      return (
        <div className="sheet" style={{ background: '#111', color: '#fff', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: 'calc(10px + var(--safe-t)) 16px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
            <button onClick={onRetake} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 15 }}>Retake</button>
            <div style={{ fontSize: 12, opacity: 0.8, textAlign: 'center' }}>{det && det.detected ? 'Edges found. Drag corners or edges.' : 'Drag the corners or edges to the paper.'}<br /><span style={{ opacity: 0.7 }}>{dims} · pinch to zoom</span></div>
            <div className="row" style={{ gap: 4 }}>
              {det && det.quad && <button onClick={redetect} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 13, opacity: 0.8 }}>Auto</button>}
              <button onClick={reset} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 13, opacity: 0.8 }}>Full</button>
            </div>

            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 26 }}>

                <img ref={imgRef} src={preview} draggable={false} style={{ width: '100%', height: '100%', display: 'block', userSelect: 'none' }} />
                {quad && <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} viewBox={`0 0 ${canvas.width} ${canvas.height}`} preserveAspectRatio="none">
                  <polygon points={quad.map(p => `${p.x},${p.y}`).join(' ')} fill="rgba(31,58,95,0.18)" stroke="#fff" strokeWidth={Math.max(2, canvas.width / 500) / zoom} vectorEffect="non-scaling-stroke" />

    }

    // ---------- Duplicates ----------
    const normName = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const nameSim = (a, b) => { const x = normName(a), y = normName(b); if (!x || !y) return false; return x === y || (x.length >= 4 && y.includes(x)) || (y.length >= 4 && x.includes(y)); };
    const dayDiff = (a, b) => { if (!a || !b) return 99; return Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000; };
    const sameTotal = (a, b) => a !== null && a !== undefined && a !== '' && b !== null && b !== undefined && b !== '' && Math.abs(+a - +b) < 0.005;
    const pairKey = (a, b) => [a.id, b.id].sort().join('|');
    // Why two receipts look like the same one, or null
    const duplicateReason = (a, b) => {
      const merch = nameSim(a.merchant, b.merchant) || nameSim(a.items, b.items);
      const days = dayDiff(a.date, b.date);
      if (sameTotal(a.total, b.total) && days === 0) return merch ? 'Same date, total and merchant' : 'Same date and total';
      if (sameTotal(a.total, b.total) && merch && days <= 1) return 'Same merchant and total, a day apart';
      const oneMissing = (a.total === null || a.total === undefined || a.total === '') !== (b.total === null || b.total === undefined || b.total === '');
      if (oneMissing && merch && days === 0) return 'Same date and merchant, one has no total';
      return null;
    };
    const findDuplicates = (receipts, ignored) => {
      const ig = new Set(ignored || []); const out = [];
      for (let i = 0; i < receipts.length; i++) for (let j = i + 1; j < receipts.length; j++) {
        const a = receipts[i], b = receipts[j]; if (ig.has(pairKey(a, b))) continue;
        const reason = duplicateReason(a, b); if (reason) out.push({ a, b, reason });
      }
      return out;
    };
    // Merge `drop` into `keep`: keep wins on every filled field, blanks fill from drop, tags union, comments joined, pages appended.
    const mergeReceipts = async (keep, drop) => {
      const has = (v) => v !== null && v !== undefined && v !== '';
      const merged = { ...keep };
      for (const k of ['items', 'merchant', 'date', 'total', 'category', 'currency']) if (!has(keep[k]) && has(drop[k])) merged[k] = drop[k];
      merged.gstIncluded = !!(keep.gstIncluded || drop.gstIncluded);
      merged.tags = Array.from(new Set([...(keep.tags || []), ...(drop.tags || [])]));
      merged.comments = [keep.comments, drop.comments].filter(Boolean).filter((c, i, arr) => arr.indexOf(c) === i).join('\n');
      merged.pages = Array.from(new Set([...(keep.pages || []), ...(drop.pages || [])]));
      merged.needsReview = !!(keep.needsReview || drop.needsReview);
      merged.unsure = Array.from(new Set([...(keep.unsure || []), ...(drop.unsure || [])]));
      merged.createdAt = [keep.createdAt, drop.createdAt].filter(Boolean).sort()[0] || keep.createdAt;
      merged.updatedAt = new Date().toISOString();

      await dbPut('receipts', merged); await dbDel('receipts', drop.id);
      return merged;
    };
    const deleteReceiptFully = async (r) => { for (const id of r.pages || []) await dbDel('images', id); await dbDel('receipts', r.id); };
    function DupCard({ r, cats, label }) {
      const col = catColour(r.category, cats);
      return (
        <div className="card grow" style={{ margin: 0, padding: 10 }}>
          <div className="small muted" style={{ marginBottom: 6, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</div>
          {r.thumb ? <img src={r.thumb} style={{ width: '100%', maxHeight: 120, objectFit: 'contain', borderRadius: 8, background: '#eee' }} /> : <div className="muted small" style={{ height: 40 }}>no image</div>}
