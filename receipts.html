          <div className="small muted">{r.items ? r.merchant : ''}</div>
          <div className="small">{fmtDate(r.date) || 'No date'} · <span className="amt">{fmtMoney(r.total, r.currency) || 'No total'}</span></div>
          <div className="chips" style={{ marginTop: 4 }}>{r.category && <span className="chip" style={{ background: col + '22', color: col }}>{r.category}</span>}{(r.tags || []).map(t => <span key={t} className="chip tag">#{t}</span>)}{(r.pages || []).length > 0 && <span className="chip" style={{ background: '#eee', color: '#555' }}>{r.pages.length} page{r.pages.length === 1 ? '' : 's'}</span>}</div>
          {r.comments && <div className="small muted" style={{ marginTop: 4, whiteSpace: 'pre-wrap' }}>{r.comments}</div>}
        </div>
      );
    }
    // Reviews a list of pairs one at a time. onResolved(kind, survivor) is called after each action; onClose when done.
    function DuplicateReview({ pairs, settings, setSettings, onResolved, onClose, newId }) {
      const [i, setI] = useState(0); const [busy, setBusy] = useState(false);
      const pair = pairs[i];
      const next = () => { if (i + 1 < pairs.length) setI(i + 1); else onClose(); };
      const act = async (fn) => { setBusy(true); try { await fn(); } catch (e) { alert(e.message); } setBusy(false); next(); };
      if (!pair) return null;
      // For a fresh capture, show the new one on the right and prefer merging into the existing one on the left
      const left = newId && pair.a.id === newId ? pair.b : pair.a, right = newId && pair.a.id === newId ? pair.a : pair.b;
      const leftLabel = newId ? 'Existing' : 'A', rightLabel = newId ? 'Just added' : 'B';
      return (
        <div className="sheet" style={{ zIndex: 45 }}>
          <div className="topbar"><button className="btn" onClick={onClose}>Close</button><h1 style={{ fontSize: 18 }}>Possible duplicate{pairs.length > 1 ? ` ${i + 1} of ${pairs.length}` : ''}</h1><span style={{ width: 70 }} /></div>
          <div className="banner info">{pair.reason}.</div>
          <div className="row" style={{ alignItems: 'stretch', padding: '0 12px 12px', gap: 8 }}><DupCard r={left} cats={settings.categories} label={leftLabel} /><DupCard r={right} cats={settings.categories} label={rightLabel} /></div>
          <div style={{ padding: '0 12px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button className="btn primary wide" disabled={busy} onClick={() => act(async () => { const m = await mergeReceipts(left, right); onResolved('merged', m, right.id); })}>Merge into {leftLabel.toLowerCase()} (keeps all pages and notes)</button>
            <div className="row">
              <button className="btn grow" disabled={busy} onClick={() => act(async () => { await deleteReceiptFully(right); onResolved('deleted', left, right.id); })}>Keep {leftLabel.toLowerCase()}, delete {rightLabel.toLowerCase()}</button>
              <button className="btn grow" disabled={busy} onClick={() => act(async () => { await deleteReceiptFully(left); onResolved('deleted', right, left.id); })}>Keep {rightLabel.toLowerCase()}, delete {leftLabel.toLowerCase()}</button>
            </div>
            <button className="btn wide" disabled={busy} onClick={() => act(async () => { setSettings(s => ({ ...s, notDuplicates: [...(s.notDuplicates || []), pairKey(left, right)] })); onResolved('kept', null, null); })}>Keep both, not a duplicate</button>
            {pairs.length > 1 && <button className="btn wide" disabled={busy} style={{ border: 'none', background: 'none' }} onClick={next}>Decide later</button>}
          </div>
        </div>
      );
    }

    // ---------- Capture flow: camera -> crop -> (more pages) -> extract -> review form ----------
    function CaptureFlow({ settings, setSettings, onSaved, onCancel, existing, receipts }) {
      // existing: receipt being edited to add pages to (optional)
      const [stage, setStage] = useState('choose'); // choose | camera | crop | pages | extracting | review
      const fileRef = useRef(null);
      const [rawCanvas, setRawCanvas] = useState(null);
      const [pages, setPages] = useState([]); // [{id, blob, url}]
      const [err, setErr] = useState(null);
      const [draft, setDraft] = useState(null);
      const onCapture = (canvas) => { setRawCanvas(canvas); setStage('crop'); };
      const onPick = async (file) => { try { const c = await fileToCanvas(file, 3600); setRawCanvas(c); setStage('crop'); } catch (e) { setErr('Could not read that image.'); setStage('pages'); } };
      const onCropDone = async (blob) => {
        const id = uid(); const url = URL.createObjectURL(blob);
        setPages(p => [...p, { id, blob, url }]); setRawCanvas(null); setStage('pages');
      };
      const removePage = (id) => setPages(p => p.filter(x => x.id !== id));
      const runExtract = async () => {
        setStage('extracting'); setErr(null);
        let data = null;
        try { data = await extractPages(pages.map(p => p.blob), settings); } catch (e) { setErr(extractErrMsg(e)); }
        setDraft(draftFromExtraction(data, settings, null));
        setStage('review');
      };
      const save = async (rec) => {
        for (const p of pages) await dbPut('images', { id: p.id, blob: p.blob });
        const thumb = pages.length ? await makeThumb(pages[0].blob) : null;
        const full = { ...rec, pages: pages.map(p => p.id), thumb, updatedAt: new Date().toISOString() };
        await dbPut('receipts', full);
        pages.forEach(p => URL.revokeObjectURL(p.url));
        const dups = findDuplicates([...(receipts || []).filter(r => r.id !== full.id), full], settings.notDuplicates).filter(d => d.a.id === full.id || d.b.id === full.id);
        if (dups.length) { setDupState({ pairs: dups, saved: full }); setStage('dup'); return; }
        onSaved(full);
      };
      const [dupState, setDupState] = useState(null);
      const dupRef = useRef(null); // the latest survivor, read on close (state would be stale inside the close handler)
      const skipExtract = () => { setDraft({ id: uid(), merchant: '', date: todayISO(), total: '', gstIncluded: false, currency: settings.currency, category: '', tags: [], comments: '', items: '', unsure: [], needsReview: false, createdAt: new Date().toISOString() }); setStage('review'); };
      if (stage === 'dup' && dupState) return <DuplicateReview pairs={dupState.pairs} newId={dupState.saved.id} settings={settings} setSettings={setSettings} onResolved={(kind, survivor, removedId) => { dupRef.current = survivor ? { saved: survivor, removedId } : { saved: dupState.saved, removedId: null }; }} onClose={() => { const d = dupRef.current || { saved: dupState.saved, removedId: null }; onSaved(d.saved, d.removedId); }} />;
      if (stage === 'choose') return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Cancel</button><h1 style={{ fontSize: 18 }}>New receipt</h1><span style={{ width: 70 }} /></div>
          <div style={{ padding: '8px 12px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button className="btn primary wide" style={{ padding: 16 }} onClick={() => setStage('camera')}>Take a photo</button>
            <button className="btn wide" style={{ padding: 16 }} onClick={() => fileRef.current && fileRef.current.click()}>Choose from gallery</button>
            <input ref={fileRef} type="file" accept="image/*" hidden onChange={e => e.target.files[0] && onPick(e.target.files[0])} />
            <button className="btn wide" style={{ padding: 16 }} onClick={skipExtract}>No image, enter details</button>
            <div className="small muted" style={{ textAlign: 'center' }}>Pages can be added later from the receipt.</div>
          </div>
        </div>
      );
      if (stage === 'camera') return <InAppCamera pageNo={pages.length + 1} onCapture={onCapture} onPick={onPick} onCancel={() => pages.length ? setStage('pages') : setStage('choose')} settings={settings} setSettings={setSettings} />;
      if (stage === 'crop' && rawCanvas) return <CropEditor canvas={rawCanvas} enhanceDefault={settings.enhanceDefault} onDone={onCropDone} onRetake={() => { setRawCanvas(null); setStage('camera'); }} />;
      if (stage === 'extracting') return (
        <div className="sheet" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 14 }}>
          <div className="spinner dark" /><div className="muted">Reading the receipt...</div>
        </div>
      );
      if (stage === 'review' && draft) return <ReceiptForm draft={draft} pages={pages} settings={settings} setSettings={setSettings} error={err} onSave={save} onCancel={() => pages.length ? setStage('pages') : setStage('choose')} onAddPage={() => setStage('camera')} onRemovePage={removePage} title="Check the details" />;
      return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Cancel</button><h1>Pages</h1><span style={{ width: 70 }} /></div>
          {err && <div className="banner err">{err}</div>}
          <div className="card">
            <div className="pages">
              {pages.map((p, i) => (
                <div key={p.id} style={{ position: 'relative' }}>
                  <img src={p.url} />
                  <div className="small" style={{ textAlign: 'center' }}>Page {i + 1}</div>
                  <button onClick={() => removePage(p.id)} style={{ position: 'absolute', top: -6, right: -6, width: 24, height: 24, borderRadius: 12, background: var_red(), color: '#fff', border: 'none', fontSize: 14, lineHeight: 1 }}>x</button>
                </div>
              ))}
              <button className="add" onClick={() => setStage('camera')}>+ Add page</button>
            </div>
          </div>
          <div style={{ padding: '0 12px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button className="btn primary wide" disabled={!pages.length} onClick={runExtract}>Read receipt with Claude</button>
            <button className="btn wide" onClick={skipExtract}>Enter details by hand</button>
          </div>
        </div>
      );
    }
    const var_red = () => '#B23A3A';

    // ---------- Receipt form (used for new and edit) ----------
    function DateField({ value, onChange, placeholder }) {
      const [text, setText] = useState(fmtDate(value));
      useEffect(() => { setText(fmtDate(value)); }, [value]);
      const pickRef = useRef(null);
      const commit = () => { const t = text.trim(); if (!t) { onChange(''); return; } const iso = parseDate(t); if (iso) onChange(iso); else setText(fmtDate(value)); };
      const openPicker = () => { const el = pickRef.current; if (!el) return; try { if (el.showPicker) el.showPicker(); else el.click(); } catch (_) { el.click(); } };
      return (
        <div className="row" style={{ position: 'relative', gap: 6 }}>
          <input className="grow" inputMode="numeric" placeholder={placeholder || 'dd/mm/yyyy'} value={text} onChange={e => setText(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); e.target.blur(); } }} />
          <button type="button" className="btn" style={{ padding: '10px 12px' }} onClick={openPicker} aria-label="Pick a date">📅</button>
          <input ref={pickRef} type="date" value={value || ''} onChange={e => onChange(e.target.value)} tabIndex={-1} style={{ position: 'absolute', right: 0, bottom: 0, width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        </div>
      );
    }
    function ChipPicker({ options, value, onChange, multi, onAdd, addLabel }) {
      const [adding, setAdding] = useState(false); const [txt, setTxt] = useState('');
      const selected = multi ? (value || []) : (value ? [value] : []);
      const toggle = (o) => { if (multi) onChange(selected.includes(o) ? selected.filter(x => x !== o) : [...selected, o]); else onChange(value === o ? '' : o); };
      const commit = () => { const t = txt.trim(); if (t) { onAdd(t); if (multi) onChange([...selected, t]); else onChange(t); } setTxt(''); setAdding(false); };
      return (
        <div className="chips">
          {options.map(o => <button key={o} type="button" className={'chip btn' + (selected.includes(o) ? ' on' : '')} onClick={() => toggle(o)}>{multi ? '#' : ''}{o}</button>)}
          {adding ? (
            <span className="row" style={{ gap: 4 }}>
              <input autoFocus style={{ padding: '4px 8px', borderRadius: 999, border: '1px solid var(--line)', width: 130, fontSize: 13 }} value={txt} onChange={e => setTxt(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') setAdding(false); }} onBlur={commit} placeholder={addLabel} />
            </span>
          ) : <button type="button" className="chip btn" style={{ borderStyle: 'dashed' }} onClick={() => setAdding(true)}>+ New</button>}
        </div>
      );
    }
    function ReceiptForm({ draft, pages, settings, setSettings, error, onSave, onCancel, onAddPage, onRemovePage, title, onDelete }) {
      const [r, setR] = useState(draft);
      const [saving, setSaving] = useState(false);
      const [armed, setArmed] = useState(false);
      const set = (k, v) => setR(x => ({ ...x, [k]: v, unsure: (x.unsure || []).filter(f => f !== k) }));
      const unsure = (k) => (r.unsure || []).includes(k);
      const addCat = (c) => { if (!settings.categories.includes(c)) setSettings(s => ({ ...s, categories: [...s.categories, c] })); };
      const addTag = (t) => { if (!settings.tags.includes(t)) setSettings(s => ({ ...s, tags: [...s.tags, t] })); };
      const doSave = async () => {
        setSaving(true);
        const out = { ...r, total: r.total === '' ? null : +r.total, gst: r.gstIncluded ? gstOf(r.total) : null, needsReview: (r.unsure || []).length > 0 };
        try { await onSave(out); } catch (e) { setSaving(false); alert('Save failed: ' + e.message); }
      };
      useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
      const Note = ({ k }) => unsure(k) ? <div className="unsure-note">Check this</div> : null;
      return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Back</button><h1 style={{ fontSize: 18 }}>{title}</h1><button className="btn primary" onClick={doSave} disabled={saving}>{saving ? '...' : 'Save'}</button></div>
          {error && <div className="banner err">{error}</div>}
          {(r.unsure || []).length > 0 && <div className="banner" style={{ background: 'var(--amber-soft)', color: 'var(--amber)' }}>Highlighted fields need a check. They were faint, missing, or a guess.</div>}
          <div className="card">
            <div className="pages">
              {pages.map((p) => (
                <div key={p.id} style={{ position: 'relative' }}>
                  <img src={p.url} />
                  {onRemovePage && <button onClick={() => onRemovePage(p.id)} style={{ position: 'absolute', top: -6, right: -6, width: 24, height: 24, borderRadius: 12, background: '#B23A3A', color: '#fff', border: 'none', fontSize: 14, lineHeight: 1 }}>x</button>}
                </div>
              ))}
              {onAddPage && <button className="add" onClick={onAddPage}>+ Add page</button>}
            </div>
          </div>
          <div className="card">
            <div className="field"><label>Item</label><input value={r.items || ''} onChange={e => set('items', e.target.value)} placeholder="What was bought" /></div>
            <div className={'field' + (unsure('merchant') ? ' unsure' : '')}><label>Merchant</label><input value={r.merchant} onChange={e => set('merchant', e.target.value)} placeholder="e.g. JB Hi-Fi" /><Note k="merchant" /></div>
            <div className="row" style={{ alignItems: 'flex-start' }}>
              <div className={'field grow' + (unsure('date') ? ' unsure' : '')}><label>Date</label><DateField value={r.date} onChange={v => set('date', v)} /><Note k="date" /></div>
              <div className={'field' + (unsure('total') ? ' unsure' : '')} style={{ width: 130 }}><label>Total ({r.currency})</label><input type="number" inputMode="decimal" step="0.01" value={r.total} onChange={e => set('total', e.target.value)} placeholder="0.00" /><Note k="total" /></div>
            </div>
            <div className="field">
              <label className="row" style={{ justifyContent: 'space-between', textTransform: 'none', letterSpacing: 0, fontSize: 15, fontWeight: 500, color: 'var(--ink)', cursor: 'pointer' }}>
                <span>GST included{r.gstIncluded && r.total !== '' ? <span className="muted small"> ({fmtMoney(gstOf(r.total), r.currency)})</span> : null}</span>
                <input type="checkbox" checked={!!r.gstIncluded} onChange={e => set('gstIncluded', e.target.checked)} style={{ width: 22, height: 22 }} />
              </label>
            </div>
            <div className={'field' + (unsure('category') ? ' unsure' : '')}>
              <label>Category (pick one)</label>
              <ChipPicker options={settings.categories} value={r.category} onChange={v => set('category', v)} onAdd={addCat} addLabel="New category" />
              <Note k="category" />
            </div>
            <div className="field">
              <label>Tags (pick any)</label>
              <ChipPicker multi options={settings.tags} value={r.tags} onChange={v => set('tags', v)} onAdd={addTag} addLabel="New tag" />
            </div>
            <div className="field"><label>Comments</label><textarea value={r.comments || ''} onChange={e => set('comments', e.target.value)} placeholder="Warranty period, who to claim from, anything else" /></div>
            <div className="row" style={{ justifyContent: 'space-between' }}><span className="small muted">Currency</span><input value={r.currency} onChange={e => set('currency', e.target.value.toUpperCase())} maxLength={3} style={{ width: 64, padding: '6px', borderRadius: 8, border: '1px solid var(--line)', textAlign: 'center' }} /></div>
          </div>
          {onDelete && <div style={{ padding: '0 12px 20px' }}><button className={'btn wide danger' + (armed ? ' armed' : '')} onClick={() => armed ? onDelete() : setArmed(true)}>{armed ? 'Tap again to delete' : 'Delete receipt'}</button></div>}
        </div>
      );
    }

    // ---------- Image viewer ----------
    function ImageViewer({ urls, names, start, onClose }) {
      const [i, setI] = useState(start || 0);
      return (
        <div style={{ position: 'fixed', inset: 0, background: '#000', zIndex: 70, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: 'calc(10px + var(--safe-t)) 16px 6px', display: 'flex', justifyContent: 'space-between', color: '#fff' }}>
            <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 15 }}>Close</button>
            <span>{i + 1} / {urls.length}</span>
            <a href={urls[i]} download={(names && names[i]) || `receipt-page-${i + 1}.jpg`} style={{ color: '#fff', fontSize: 13 }}>Save</a>
          </div>
          <ZoomPane key={i} style={{ flex: 1 }} maxScale={8}>
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <img src={urls[i]} draggable={false} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
            </div>
          </ZoomPane>
          {urls.length > 1 && <div style={{ display: 'flex', justifyContent: 'center', gap: 10, padding: '10px 0 calc(16px + var(--safe-b))' }}>
            <button className="btn" onClick={() => setI((i + urls.length - 1) % urls.length)}>Prev</button>
            <button className="btn" onClick={() => setI((i + 1) % urls.length)}>Next</button>
          </div>}
        </div>
      );
    }

    // ---------- Receipt detail (view + edit) ----------
    function ReceiptDetail({ receipt, settings, setSettings, onClose, onChanged, onDeleted }) {
      const [pages, setPages] = useState([]);
      const [editing, setEditing] = useState(false);
      const [viewer, setViewer] = useState(null);
      const [adding, setAdding] = useState(false);
      const [rescan, setRescan] = useState(null); const [reading, setReading] = useState(false); const [readErr, setReadErr] = useState(null);
      const reread = async () => {
        if (!pages.length) return; setReading(true); setReadErr(null);
        try { const data = await extractPages(pages.map(p => p.blob), settings); setRescan(draftFromExtraction(data, settings, receipt)); }
        catch (e) { setReadErr(extractErrMsg(e)); }
        setReading(false);
      };
      useEffect(() => {
        let urls = [];
        (async () => { const out = []; for (const id of receipt.pages || []) { const b = await dbGetImageBlob(id); if (b) { const url = URL.createObjectURL(b); urls.push(url); out.push({ id, blob: b, url }); } } setPages(out); })();
        return () => urls.forEach(u => URL.revokeObjectURL(u));
      }, [receipt.pages]);
      const save = async (rec) => { const full = { ...receipt, ...rec, updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); setEditing(false); };
      useEffect(() => { (async () => { const first = (receipt.pages || [])[0]; if (!first && receipt.thumb) { const full = { ...receipt, thumb: null }; await dbPut('receipts', full); onChanged(full); } else if (first && !receipt.thumb) { const b = await dbGetImageBlob(first); if (b) { const full = { ...receipt, thumb: await makeThumb(b) }; await dbPut('receipts', full); onChanged(full); } } })(); }, [receipt.pages]);
      const del = async () => { for (const id of receipt.pages || []) await dbDel('images', id); await dbDel('receipts', receipt.id); onDeleted(receipt.id); };
      const removePage = async (id) => { await dbDel('images', id); const rest = (receipt.pages || []).filter(p => p !== id); const full = { ...receipt, pages: rest, updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); };
      const addPageDone = async (blob) => { const id = uid(); await dbPut('images', { id, blob }); const full = { ...receipt, pages: [...(receipt.pages || []), id], updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); setAdding(false); };
      if (adding) return <AddPageFlow settings={settings} setSettings={setSettings} onDone={addPageDone} onCancel={() => setAdding(false)} />;
      if (rescan) return <ReceiptForm draft={{ ...rescan, total: rescan.total ?? '' }} pages={pages} settings={settings} setSettings={setSettings} onSave={async (rec) => { await save(rec); setRescan(null); }} onCancel={() => setRescan(null)} title="Check the re-read" />;
      if (editing) return <ReceiptForm draft={{ ...receipt, total: receipt.total ?? '', gstIncluded: !!receipt.gstIncluded, tags: receipt.tags || [] }} pages={pages} settings={settings} setSettings={setSettings} onSave={save} onCancel={() => setEditing(false)} onRemovePage={removePage} onAddPage={() => { setEditing(false); setAdding(true); }} title="Edit receipt" onDelete={del} />;
      const col = catColour(receipt.category, settings.categories);
      return (
        <div className="sheet">
          {viewer !== null && <ImageViewer urls={pages.map(p => p.url)} names={pages.map((p, i) => pageFileName(receipt, i, p.id))} start={viewer} onClose={() => setViewer(null)} />}
          <div className="topbar"><button className="btn" onClick={onClose}>Back</button><h1 style={{ fontSize: 18 }}>Receipt</h1><button className="btn" onClick={() => setEditing(true)}>Edit</button></div>
          {receipt.needsReview && <div className="banner" style={{ background: 'var(--amber-soft)', color: 'var(--amber)' }}>Some fields were unsure when this was read. Open Edit to confirm them.</div>}
          <div className="card">
            <div className="row" style={{ alignItems: 'flex-start', justifyContent: 'space-between' }}>
              <div className="grow">
                <div style={{ fontSize: 20, fontWeight: 700, lineHeight: 1.25 }}>{receipt.items || receipt.merchant || 'Receipt'}</div>
                <div className="muted" style={{ marginTop: 2 }}>{receipt.items ? (receipt.merchant || 'Unknown merchant') : ''}{receipt.items && receipt.merchant ? ' · ' : ''}{fmtDate(receipt.date) || 'No date'}</div>
              </div>
              <div style={{ fontSize: 24, fontWeight: 700, whiteSpace: 'nowrap' }} className="amt">{fmtMoney(receipt.total, receipt.currency) || 'No total'}</div>
            </div>
            <div className="chips" style={{ marginTop: 10 }}>
              {receipt.category && <span className="chip" style={{ background: col + '22', color: col }}>{receipt.category}</span>}
              {(receipt.tags || []).map(t => <span key={t} className="chip tag">#{t}</span>)}
            </div>
            <div className="kv" style={{ marginTop: 12 }}>
              <span className="k">GST</span><span>{receipt.gstIncluded ? `Included, ${fmtMoney(gstOf(receipt.total), receipt.currency)}` : 'Not included'}</span>
              {receipt.comments && <><span className="k">Comments</span><span style={{ whiteSpace: 'pre-wrap' }}>{receipt.comments}</span></>}
              <span className="k">Added</span><span>{fmtDate((receipt.createdAt || '').slice(0, 10))}</span>
            </div>
          </div>
          {readErr && <div className="banner err" onClick={() => setReadErr(null)}>{readErr}</div>}
          <div className="section-h"><span>{pages.length ? `Pages (${pages.length})` : 'No image yet'}</span><div className="row" style={{ gap: 6 }}>{pages.length > 0 && <button className="chip btn" disabled={reading} onClick={reread}>{reading ? 'Reading...' : 'Read again with Claude'}</button>}<button className="chip btn" onClick={() => setAdding(true)}>+ Add page</button></div></div>
          <div style={{ padding: '0 12px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            {pages.map((p, i) => <img key={p.id} src={p.url} onClick={() => setViewer(i)} style={{ width: '100%', borderRadius: 10, border: '1px solid var(--line)', background: '#fff' }} />)}
          </div>
        </div>
      );
    }
    function AddPageFlow({ settings, setSettings, onDone, onCancel }) {
      const [canvas, setCanvas] = useState(null);
      const onPick = async (f) => { try { setCanvas(await fileToCanvas(f, 3600)); } catch (_) { onCancel(); } };
      if (canvas) return <CropEditor canvas={canvas} enhanceDefault={settings.enhanceDefault} onDone={(blob) => onDone(blob)} onRetake={() => setCanvas(null)} />;
      return <InAppCamera pageNo="+" onCapture={setCanvas} onPick={onPick} onCancel={onCancel} settings={settings} setSettings={setSettings} />;
    }

    // ---------- List with filter and sort ----------
    const EMPTY_FILTER = { sort: 'date_desc', from: '', to: '', cats: [], tags: [], review: false };
    const filterCount = (f) => (f.from ? 1 : 0) + (f.to ? 1 : 0) + f.cats.length + f.tags.length + (f.review ? 1 : 0);
    function ReceiptRow({ r, cats, onOpen }) {
      const col = catColour(r.category, cats);
      return (
        <div className="card row" onClick={onOpen} style={{ cursor: 'pointer' }}>
          {r.thumb ? <img className="thumb" src={r.thumb} /> : <div className="thumb" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: 'var(--muted)' }}>no image</div>}
          <div className="grow">
            <div className="row" style={{ justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div style={{ fontWeight: 600, lineHeight: 1.25 }}>{r.items || r.merchant || 'Receipt'}</div>
              <div className="amt" style={{ whiteSpace: 'nowrap' }}>{fmtMoney(r.total, r.currency)}</div>
            </div>
            <div className="small muted">{r.items ? (r.merchant || 'Unknown merchant') + ' · ' : ''}{fmtDate(r.date)}</div>
            <div className="chips" style={{ marginTop: 5 }}>
              {r.category && <span className="chip" style={{ background: col + '22', color: col }}>{r.category}</span>}
              {(r.tags || []).map(t => <span key={t} className="chip tag">#{t}</span>)}
              {r.needsReview && <span className="chip warn">Check</span>}
              {(r.pages || []).length > 1 && <span className="chip" style={{ background: '#eee', color: '#555' }}>{r.pages.length} pages</span>}
            </div>
          </div>
        </div>
      );
    }
    function ReceiptList({ receipts, settings, onOpen, filter, setFilter }) {
      const [q, setQ] = useState('');
      const [panel, setPanel] = useState(false);
      const f = { ...EMPTY_FILTER, ...filter };
      const shown = useMemo(() => {
        let list = receipts.slice();
        if (f.cats.length) list = list.filter(r => f.cats.includes(r.category));
        if (f.tags.length) list = list.filter(r => f.tags.some(t => (r.tags || []).includes(t)));
        if (f.review) list = list.filter(r => r.needsReview);
        if (f.from) list = list.filter(r => (r.date || '') >= f.from);
        if (f.to) list = list.filter(r => (r.date || '') <= f.to);
        if (q.trim()) { const s = q.trim().toLowerCase(); list = list.filter(r => [r.merchant, r.items, r.comments, r.category, (r.tags || []).join(' '), String(r.total)].join(' ').toLowerCase().includes(s)); }
        const byDate = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || '');
        if (f.sort === 'date_asc') list.sort(byDate);
        else if (f.sort === 'amount_desc') list.sort((a, b) => (+b.total || 0) - (+a.total || 0));
        else if (f.sort === 'amount_asc') list.sort((a, b) => (+a.total || 0) - (+b.total || 0));
        else list.sort((a, b) => byDate(b, a));
        return list;
      }, [receipts, f.cats, f.tags, f.review, f.from, f.to, f.sort, q]);
      const total = shown.reduce((s, r) => s + (+r.total || 0), 0);
      const grouped = f.sort === 'date_desc' || f.sort === 'date_asc';
      const groups = useMemo(() => { if (!grouped) return [{ key: 'all', label: null, items: shown, sum: total }]; const g = []; let cur = null; for (const r of shown) { const k = (r.date || '').slice(0, 7); if (!cur || cur.key !== k) { cur = { key: k, label: r.date ? monthLabel(r.date.slice(0, 7) + '-01') : 'Unknown date', items: [], sum: 0 }; g.push(cur); } cur.items.push(r); cur.sum += (+r.total || 0); } return g; }, [shown, grouped]);
      const reviewCount = receipts.filter(r => r.needsReview).length;
      const n = filterCount(f);
      const toggleIn = (key, v) => setFilter({ ...f, [key]: f[key].includes(v) ? f[key].filter(x => x !== v) : [...f[key], v] });
      const sortLabel = { date_desc: 'Newest first', date_asc: 'Oldest first', amount_desc: 'Largest first', amount_asc: 'Smallest first' }[f.sort];
      return (
        <>
          <div className="row" style={{ padding: '0 12px 8px', gap: 8 }}>
            <input className="search grow" placeholder="Search item, merchant, comments" value={q} onChange={e => setQ(e.target.value)} />
            <button className={'btn' + (n || panel ? ' primary' : '')} style={{ whiteSpace: 'nowrap', padding: '10px 14px' }} onClick={() => setPanel(p => !p)}>Filter{n ? ` (${n})` : ''}</button>
          </div>
          {panel && (
            <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div>
                <div className="flabel" style={{ marginBottom: 6 }}>Sort</div>
                <div className="chips">
                  {[['date_desc', 'Newest'], ['date_asc', 'Oldest'], ['amount_desc', 'Largest'], ['amount_asc', 'Smallest']].map(([k, l]) => <button key={k} className={'chip btn' + (f.sort === k ? ' on' : '')} onClick={() => setFilter({ ...f, sort: k })}>{l}</button>)}
                </div>
              </div>
              <div>
                <div className="flabel" style={{ marginBottom: 6 }}>Date range</div>
                <div className="row" style={{ alignItems: 'flex-start' }}>
                  <div className="grow"><DateField value={f.from} onChange={v => setFilter({ ...f, from: v })} placeholder="From" /></div>
                  <div className="grow"><DateField value={f.to} onChange={v => setFilter({ ...f, to: v })} placeholder="To" /></div>
                </div>
              </div>
              <div>
                <div className="flabel" style={{ marginBottom: 6 }}>Category (any of)</div>
                <div className="chips">{settings.categories.map(c => <button key={c} className={'chip btn' + (f.cats.includes(c) ? ' on' : '')} onClick={() => toggleIn('cats', c)}>{c}</button>)}</div>
              </div>
              <div>
                <div className="flabel" style={{ marginBottom: 6 }}>Tag (any of)</div>
                <div className="chips">{settings.tags.map(t => <button key={t} className={'chip btn' + (f.tags.includes(t) ? ' on' : '')} onClick={() => toggleIn('tags', t)}>#{t}</button>)}</div>
              </div>
              <div className="row" style={{ justifyContent: 'space-between' }}>
                <button className={'chip btn' + (f.review ? ' on' : '')} onClick={() => setFilter({ ...f, review: !f.review })}>Needs check{reviewCount ? ` (${reviewCount})` : ''}</button>
                <div className="row"><button className="btn" onClick={() => setFilter({ ...EMPTY_FILTER, sort: f.sort })} disabled={!n}>Clear</button><button className="btn primary" onClick={() => setPanel(false)}>Done</button></div>
              </div>
            </div>
          )}
          {!panel && n > 0 && (
            <div className="filters">
              {f.from && <button className="chip btn on" onClick={() => setFilter({ ...f, from: '' })}>from {fmtDate(f.from)} x</button>}
              {f.to && <button className="chip btn on" onClick={() => setFilter({ ...f, to: '' })}>to {fmtDate(f.to)} x</button>}
              {f.cats.map(c => <button key={c} className="chip btn on" onClick={() => toggleIn('cats', c)}>{c} x</button>)}
              {f.tags.map(t => <button key={t} className="chip btn on" onClick={() => toggleIn('tags', t)}>#{t} x</button>)}
              {f.review && <button className="chip btn on" onClick={() => setFilter({ ...f, review: false })}>Needs check x</button>}
            </div>
          )}
          <div className="total-line"><span>{shown.length} receipt{shown.length === 1 ? '' : 's'} · {sortLabel}</span><span className="amt">{fmtMoney(total, settings.currency)}</span></div>
          {!shown.length && <div className="empty">{receipts.length ? 'Nothing matches.' : 'No receipts yet. Tap + to add one.'}</div>}
          {groups.map(g => (
            <div key={g.key}>
              {g.label && <div className="section-h"><span>{g.label}</span><span className="amt">{fmtMoney(g.sum, settings.currency)}</span></div>}
              {g.items.map(r => <ReceiptRow key={r.id} r={r} cats={settings.categories} onOpen={() => onOpen(r)} />)}
            </div>
          ))}
        </>
      );
    }

    // ---------- Settings ----------
    function Settings({ settings, setSettings, receipts, reload, onFindDuplicates, dupCount }) {
      const [msg, setMsg] = useState(null);
      const [busy, setBusy] = useState(false);
      const [newCat, setNewCat] = useState('');
      const [armed, setArmed] = useState(null);
      const [keyDraft, setKeyDraft] = useState(settings.apiKey);
      const [confirmRestore, setConfirmRestore] = useState(false);
      useEffect(() => { if (!confirmRestore) return; const t = setTimeout(() => setConfirmRestore(false), 4000); return () => clearTimeout(t); }, [confirmRestore]);
      const driveConnect = async () => {
        setBusy(true);
        try { await driveToken(DRIVE_CLIENT_ID, true); setSettings(s => ({ ...s, driveConnected: true })); note('ok', 'Connected to Google Drive. Tap Sync to Drive to back up.'); }
        catch (e) { note('err', e.message); } finally { setBusy(false); }
      };
      const driveDisconnect = () => {
        try { sessionStorage.removeItem('receipts_gtoken'); } catch (_) {}
        gis.token = null; gis.exp = 0;
        setSettings(s => ({ ...s, driveConnected: false, driveFolderId: '' })); setConfirmRestore(false); note('ok', 'Disconnected. Your Drive files are untouched.');
      };
      useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(null), 3000); return () => clearTimeout(t); }, [armed]);
      const note = (kind, text) => setMsg({ kind, text });
      const doExport = async () => {
        setBusy(true);
        try { const zip = await buildExportZip(receipts, settings); const name = `receipts-${todayISO()}.zip`; const how = await shareOrDownload(zip, name); note('ok', how === 'shared' ? 'Exported and shared.' : how === 'downloaded' ? `Exported ${name} to your downloads.` : 'Export cancelled.'); }
        catch (e) { note('err', 'Export failed: ' + e.message); } finally { setBusy(false); }
      };
      const doExportCSV = () => { downloadBlob(new Blob([buildCSV(receipts)], { type: 'text/csv' }), `receipts-${todayISO()}.csv`); note('ok', 'CSV saved to downloads.'); };
      const doImport = async (file) => {
        if (!file) return; setBusy(true);
        try {
          const res = await importData(file, receipts);
          setSettings(s => ({ ...s, categories: Array.from(new Set([...s.categories, ...res.categories])), tags: Array.from(new Set([...s.tags, ...res.tags])), notDuplicates: Array.from(new Set([...(s.notDuplicates || []), ...res.notDuplicates])) }));
          await reload(); note('ok', `Imported: ${res.added} new, ${res.updated} updated.`);
        } catch (e) { note('err', 'Import failed: ' + e.message); } finally { setBusy(false); }
      };
      const removeCat = async (c) => {
        setSettings(s => ({ ...s, categories: s.categories.filter(x => x !== c) }));
        for (const r of receipts) if (r.category === c) await dbPut('receipts', { ...r, category: '', updatedAt: new Date().toISOString() });
        await reload(); setArmed(null);
      };
      const addCat = () => { const c = newCat.trim(); if (!c || settings.categories.includes(c)) return; setSettings(s => ({ ...s, categories: [...s.categories, c] })); setNewCat(''); };
      const [newTag, setNewTag] = useState('');
      const addTag = () => { const t = newTag.trim(); if (!t || settings.tags.includes(t)) return; setSettings(s => ({ ...s, tags: [...s.tags, t] })); setNewTag(''); };
      const removeTag = async (t) => {
        setSettings(s => ({ ...s, tags: s.tags.filter(x => x !== t) }));
        for (const r of receipts) if ((r.tags || []).includes(t)) await dbPut('receipts', { ...r, tags: r.tags.filter(x => x !== t), updatedAt: new Date().toISOString() });
        await reload(); setArmed(null);
      };
      // Drive
      const driveSync = async () => {
        setBusy(true);
        try {
          const token = await driveToken(DRIVE_CLIENT_ID, true);
          const folder = await driveFolder(token); // always resolve the path; a cached id could point at an old or renamed folder
          const files = await driveList(token, folder);
          const byName = {}, byId = {}; files.forEach(f => { byName[f.name] = f; const id = idFromFileName(f.name); if (id) byId[id] = f; });
          let up = 0, renamed = 0;
          for (const r of receipts) for (const [i, pid] of (r.pages || []).entries()) {
            const want = pageFileName(r, i, pid);
            const have = byId[pid];
            if (have) { if (have.name !== want) { await dfetch(token, `https://www.googleapis.com/drive/v3/files/${have.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: want }) }); renamed++; } continue; }
            const blob = await dbGetImageBlob(pid); if (!blob) continue;
            await driveUpload(token, folder, want, blob); up++;
          }
          const manifest = new Blob([JSON.stringify({ app: 'Receipts', build: BUILD_VERSION, exportedAt: new Date().toISOString(), categories: settings.categories, tags: settings.tags, notDuplicates: settings.notDuplicates || [], receipts: receipts.map(r => ({ ...r, thumb: undefined })) })], { type: 'application/json' });
          await driveUpload(token, folder, 'receipts.json', manifest, byName['receipts.json'] && byName['receipts.json'].id);
          setSettings(s => ({ ...s, driveConnected: true, driveFolderId: folder, lastSync: new Date().toISOString() }));
          note('ok', `Synced to Drive. ${up} new image${up === 1 ? '' : 's'} uploaded${renamed ? `, ${renamed} renamed` : ''}.`);
        } catch (e) { note('err', 'Drive sync failed: ' + e.message); } finally { setBusy(false); }
      };
      const driveRestore = async () => {
        setConfirmRestore(false); setBusy(true);
        try {
          const token = await driveToken(DRIVE_CLIENT_ID, true);
          const folder = await driveFolder(token); // always resolve the path; a cached id could point at an old or renamed folder
          const files = await driveList(token, folder);
          const mf = files.find(f => f.name === 'receipts.json'); if (!mf) throw new Error('No receipts.json in the Drive folder yet.');
          const manifest = JSON.parse(await (await driveDownload(token, mf.id)).text());
          const byId = {}; files.forEach(f => { const id = idFromFileName(f.name); if (id) byId[id] = f; });
          let added = 0, imgs = 0;
          for (const r of manifest.receipts || []) {
            for (const pid of r.pages || []) { if (await dbGet('images', pid)) continue; const f = byId[pid]; if (!f) continue; await dbPut('images', { id: pid, blob: await normalisePageBlob(await driveDownload(token, f.id)) }); imgs++; }
            const cur = receipts.find(x => x.id === r.id);
            if (cur && (cur.updatedAt || '') >= (r.updatedAt || '')) continue;
            let thumb = null; if (r.pages && r.pages[0]) { const b = await dbGetImageBlob(r.pages[0]); if (b) thumb = await makeThumb(b); }
            await dbPut('receipts', { ...r, thumb }); added++;
          }
          setSettings(s => ({ ...s, driveConnected: true, driveFolderId: folder, categories: Array.from(new Set([...s.categories, ...(manifest.categories || [])])), tags: Array.from(new Set([...s.tags, ...(manifest.tags || [])])), notDuplicates: Array.from(new Set([...(s.notDuplicates || []), ...(manifest.notDuplicates || [])])) }));
          await reload(); note('ok', `Restored ${added} receipt${added === 1 ? '' : 's'} and ${imgs} image${imgs === 1 ? '' : 's'} from Drive.`);
        } catch (e) { note('err', 'Restore failed: ' + e.message); } finally { setBusy(false); }
      };
      const [diag, setDiag] = useState(null);
      const runDiag = async () => {
        let est = null; try { est = await navigator.storage.estimate(); } catch (_) {}
        let persisted = null; try { persisted = await navigator.storage.persisted(); if (!persisted) persisted = await navigator.storage.persist(); } catch (_) {}
        const imgs = await dbGetAll('images');
        setDiag({ receipts: receipts.length, images: imgs.length, bytes: imgs.reduce((s, i) => s + (i.blob ? i.blob.size : 0), 0), quota: est, persisted, standalone: window.matchMedia('(display-mode: standalone)').matches, ua: navigator.userAgent });
      };
      const mb = (b) => (b / 1048576).toFixed(1) + ' MB';
      return (
        <>
          {msg && <div className={'banner ' + (msg.kind === 'ok' ? 'ok' : 'err')} onClick={() => setMsg(null)}>{msg.text}</div>}
          <div className="section-h"><span>Claude API key</span></div>
          <div className="card">
            <div className="small muted" style={{ marginBottom: 8 }}>Used to read receipts. Get a key at console.anthropic.com. Stored only on this device.</div>
            <div className="row"><input className="grow" type="password" style={{ padding: '10px', borderRadius: 8, border: '1px solid var(--line)' }} placeholder="sk-ant-..." value={keyDraft} onChange={e => setKeyDraft(e.target.value)} /><button className="btn" onClick={() => { setSettings(s => ({ ...s, apiKey: keyDraft.trim() })); note('ok', 'API key saved.'); }}>Save</button></div>
            <div className="small muted" style={{ marginTop: 6 }}>{settings.apiKey ? 'Key is set.' : 'No key set. Receipts can still be entered by hand.'}</div>
          </div>

          <div className="section-h"><span>Categories (one per receipt)</span></div>
          <div className="card">
            {settings.categories.map(c => (
              <div key={c} className="row" style={{ padding: '6px 0', borderBottom: '1px solid var(--line)' }}>
                <span className="chip" style={{ background: catColour(c, settings.categories) + '22', color: catColour(c, settings.categories) }}>{c}</span>
                <span className="grow small muted">{receipts.filter(r => r.category === c).length} receipts</span>
                <button className="chip btn" style={armed === c ? { background: '#B23A3A', color: '#fff', borderColor: '#B23A3A' } : {}} onClick={() => armed === c ? removeCat(c) : setArmed(c)}>{armed === c ? 'Confirm' : 'Remove'}</button>
              </div>
            ))}
            <div className="row" style={{ marginTop: 10 }}><input className="grow" style={{ padding: '10px', borderRadius: 8, border: '1px solid var(--line)' }} placeholder="New category" value={newCat} onChange={e => setNewCat(e.target.value)} /><button className="btn" onClick={addCat}>Add</button></div>
          </div>

          <div className="section-h"><span>Tags (any number per receipt)</span></div>
          <div className="card">
            {settings.tags.map(t => (
              <div key={t} className="row" style={{ padding: '6px 0', borderBottom: '1px solid var(--line)' }}>
                <span className="chip tag">#{t}</span>
                <span className="grow small muted">{receipts.filter(r => (r.tags || []).includes(t)).length} receipts</span>
                <button className="chip btn" style={armed === 'tag:' + t ? { background: '#B23A3A', color: '#fff', borderColor: '#B23A3A' } : {}} onClick={() => armed === 'tag:' + t ? removeTag(t) : setArmed('tag:' + t)}>{armed === 'tag:' + t ? 'Confirm' : 'Remove'}</button>
              </div>
            ))}
            <div className="row" style={{ marginTop: 10 }}><input className="grow" style={{ padding: '10px', borderRadius: 8, border: '1px solid var(--line)' }} placeholder="New tag, e.g. Tax 2026" value={newTag} onChange={e => setNewTag(e.target.value)} /><button className="btn" onClick={addTag}>Add</button></div>
          </div>

          <div className="section-h"><span>Capture</span></div>
          <div className="card">
            <label className="row" style={{ justifyContent: 'space-between' }}><span>Enhance scans by default (black and white, cleaned)</span><input type="checkbox" checked={settings.enhanceDefault} onChange={e => setSettings(s => ({ ...s, enhanceDefault: e.target.checked }))} style={{ width: 22, height: 22 }} /></label>
            <div className="row" style={{ justifyContent: 'space-between', marginTop: 10 }}><span>Currency</span><input value={settings.currency} maxLength={3} onChange={e => setSettings(s => ({ ...s, currency: e.target.value.toUpperCase() }))} style={{ width: 70, padding: '8px', borderRadius: 8, border: '1px solid var(--line)', textAlign: 'center' }} /></div>
            {settings.cameraDevice && <button className="btn" style={{ marginTop: 10 }} onClick={() => setSettings(s => ({ ...s, cameraDevice: '' }))}>Forget remembered lens</button>}
          </div>

          <div className="section-h"><span>Duplicates</span></div>
          <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div className="small muted">Same date and total, or same merchant and total a day apart, counts as a possible duplicate. Each pair can be merged, one deleted, or marked as not a duplicate.</div>
            <button className="btn" disabled={!dupCount} onClick={onFindDuplicates}>{dupCount ? `Review ${dupCount} possible duplicate${dupCount === 1 ? '' : 's'}` : 'No duplicates found'}</button>
            {(settings.notDuplicates || []).length > 0 && <button className="btn" onClick={() => setSettings(s => ({ ...s, notDuplicates: [] }))}>Forget "not a duplicate" answers ({settings.notDuplicates.length})</button>}
          </div>

          <div className="section-h"><span>Backup: export and import</span></div>
          <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div className="small muted">The zip holds every receipt, its images, and a CSV. Share it to Google Drive from the share sheet, or keep it anywhere. Import accepts that zip, a bare receipts.json, or the Drive folder downloaded as a zip from Google. It merges by receipt and keeps the newer version.</div>
            <button className="btn primary" disabled={busy || !receipts.length} onClick={doExport}>Export everything (zip)</button>
            <button className="btn" disabled={!receipts.length} onClick={doExportCSV}>Export CSV only</button>
            <label className="btn" style={{ textAlign: 'center' }}>Import zip or json<input type="file" accept=".zip,.json,application/zip,application/json" hidden onChange={e => doImport(e.target.files[0])} /></label>
          </div>

          <div className="section-h"><span>Google Drive sync</span></div>
          <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div className="small muted">Keeps a folder called "{DRIVE_FOLDER}" in My Drive with every receipt image and a receipts.json. The app can only see files it created. Sync uploads what is new. Restore pulls anything missing on this phone.</div>
            {!settings.driveConnected ? (
              <button className="btn primary" disabled={busy} onClick={driveConnect}>Connect Google Drive</button>
            ) : (
              <>
                <div className="row" style={{ justifyContent: 'space-between' }}><span className="row" style={{ gap: 6 }}><span className="sync-dot" style={{ background: 'var(--green)' }} />Connected</span><button className="chip btn" onClick={driveDisconnect}>Disconnect</button></div>
                <div className="row"><button className="btn primary grow" disabled={busy} onClick={driveSync}>Sync to Drive</button><button className={'btn grow' + (confirmRestore ? ' danger armed' : '')} disabled={busy} onClick={() => confirmRestore ? driveRestore() : setConfirmRestore(true)}>{confirmRestore ? 'Tap again to restore' : 'Restore from Drive'}</button></div>
                <div className="small muted">{settings.lastSync ? 'Last sync: ' + new Date(settings.lastSync).toLocaleString('en-AU') : 'Never synced.'}</div>
              </>
            )}
          </div>

          <div className="section-h"><span>Diagnostics</span></div>
          <div className="card">
            <div className="small" style={{ fontFamily: 'monospace' }}>build {BUILD_VERSION}</div>
            <button className="btn" style={{ marginTop: 8 }} onClick={runDiag}>Check storage</button>
            {diag && <div className="small muted" style={{ marginTop: 8, whiteSpace: 'pre-wrap' }}>
              {`${diag.receipts} receipts, ${diag.images} images, ${mb(diag.bytes)}\n`}
              {diag.quota ? `Using ${mb(diag.quota.usage)} of ${mb(diag.quota.quota)} available\n` : ''}
              {`Persistent storage: ${diag.persisted === null ? 'unknown' : diag.persisted ? 'granted' : 'not granted (export regularly)'}\n`}
              {`Installed as app: ${diag.standalone ? 'yes' : 'no'}`}
            </div>}
          </div>
        </>
      );
    }

    // ---------- App ----------
    function App() {
      const [settings, setSettingsState] = useState(loadSettings);
      const setSettings = useCallback((fn) => setSettingsState(s => { const n = typeof fn === 'function' ? fn(s) : fn; saveSettings(n); return n; }), []);
      const [receipts, setReceipts] = useState([]);
      const [showSettings, setShowSettings] = useState(false);
      const [capturing, setCapturing] = useState(false);
      const [open, setOpen] = useState(null);
      const [filter, setFilter] = useState(EMPTY_FILTER);
      const [loaded, setLoaded] = useState(false);
      const reload = useCallback(async () => { try { const all = await dbGetAll('receipts'); setReceipts(all); } catch (e) { console.error(e); } setLoaded(true); }, []);
      useEffect(() => { reload(); }, []);
      useEffect(() => { if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {}); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {} }, []);
      const onSaved = (r, removedId) => { setReceipts(list => [...list.filter(x => x.id !== r.id && x.id !== removedId), r]); setCapturing(false); setOpen(r); };
      const [dupReview, setDupReview] = useState(false);
      const dupPairs = useMemo(() => findDuplicates(receipts, settings.notDuplicates), [receipts, settings.notDuplicates]);
      const onChanged = (r) => { setReceipts(list => list.map(x => x.id === r.id ? r : x)); setOpen(r); };
      const onDeleted = (id) => { setReceipts(list => list.filter(x => x.id !== id)); setOpen(null); };
      if (capturing) return <CaptureFlow settings={settings} setSettings={setSettings} onSaved={onSaved} onCancel={() => setCapturing(false)} receipts={receipts} />;
      if (dupReview) return <DuplicateReview pairs={dupPairs} settings={settings} setSettings={setSettings} onResolved={() => reload()} onClose={() => setDupReview(false)} />;
      if (open) return <ReceiptDetail receipt={open} settings={settings} setSettings={setSettings} onClose={() => setOpen(null)} onChanged={onChanged} onDeleted={onDeleted} />;
      if (showSettings) return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={() => setShowSettings(false)}>Back</button><h1 style={{ fontSize: 18 }}>Settings</h1><span style={{ width: 70 }} /></div>
          <Settings settings={settings} setSettings={setSettings} receipts={receipts} reload={reload} onFindDuplicates={() => { setShowSettings(false); setDupReview(true); }} dupCount={dupPairs.length} />
        </div>
      );
      return (
        <div className="app">
          <div className="topbar"><h1>Receipts</h1><div className="row"><span className="small muted">{receipts.length} total</span><button className="btn" style={{ padding: '8px 12px' }} onClick={() => setShowSettings(true)} aria-label="Settings">⚙️</button></div></div>
          {loaded && dupPairs.length > 0 && <div className="banner" style={{ background: 'var(--amber-soft)', color: 'var(--amber)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><span>{dupPairs.length} possible duplicate{dupPairs.length === 1 ? '' : 's'}</span><button className="chip btn" onClick={() => setDupReview(true)}>Review</button></div>}
          {!loaded ? <div className="empty">Loading...</div> : <ReceiptList receipts={receipts} settings={settings} onOpen={setOpen} filter={filter} setFilter={setFilter} />}
          <button className="fab" onClick={() => setCapturing(true)} aria-label="Add receipt">+</button>
        </div>
      );
    }
    window.__receipts = { makeZip, readZip, buildExportZip, importData, dbGetAll, detectReceipt }; // for testing from the console
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
