<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#F7F7F8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Receipts design</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* Design system: neutral visual system, house default. Tokens first, nothing improvised below. */
    :root {
      color-scheme: light dark;
      --surface: #FFFFFF; --surface-2: #F7F7F8; --surface-3: #EFEFF1;
      --text: #1A1A1F; --text-2: #5C5C66; --text-3: #8A8A94;
      --border: #E4E4E8; --border-strong: #D4D4DA;
      --accent: #2563EB; --accent-tint: #EAF0FD; --accent-text: #1D4ED8; --on-accent: #FFFFFF;
      --red: #DC2626; --red-tint: #FDECEC; --green: #16A34A; --green-tint: #E9F7EE; --amber: #B45309; --amber-tint: #FDF3E1;
      --r-control: 8px; --r-card: 12px; --r-pill: 999px;
      --shadow-float: 0 4px 12px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.06);
      --ease-out: cubic-bezier(0.2, 0, 0, 1); --dur: 200ms;
      /* names the logic still uses */
      --bg: var(--surface-2); --card: var(--surface); --ink: var(--text); --muted: var(--text-2); --line: var(--border);
      --navy: var(--accent); --navy-soft: var(--accent-tint); --amber-soft: var(--amber-tint); --green-soft: var(--green-tint); --radius: var(--r-card);
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"], :root:not([data-theme="light"]) .dark-tokens { color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #1C1C21; --surface-2: #121215; --surface-3: #26262C;
        --text: #F2F2F4; --text-2: #A9A9B1; --text-3: #7C7C86;
        --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
        --accent: #6B96F5; --accent-tint: #1C2A48; --accent-text: #9DB8FA; --on-accent: #0B1220;
        --red: #F87171; --red-tint: #3A1D1D; --green: #4ADE80; --green-tint: #17301F; --amber: #FBBF24; --amber-tint: #3A2E12;
        --shadow-float: 0 4px 16px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
      }
    }
    :root[data-theme="dark"] {
      --surface: #1C1C21; --surface-2: #121215; --surface-3: #26262C;
      --text: #F2F2F4; --text-2: #A9A9B1; --text-3: #7C7C86;
      --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.18);
      --accent: #6B96F5; --accent-tint: #1C2A48; --accent-text: #9DB8FA; --on-accent: #0B1220;
      --red: #F87171; --red-tint: #3A1D1D; --green: #4ADE80; --green-tint: #17301F; --amber: #FBBF24; --amber-tint: #3A2E12;
      --shadow-float: 0 4px 16px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; font-size: 16px; line-height: 1.5; }
    body { min-height: 100vh; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    .app { min-height: 100vh; padding-bottom: calc(96px + var(--safe-b)); max-width: 640px; margin: 0 auto; }
    .sheet > * { max-width: 640px; margin-left: auto; margin-right: auto; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(12px + var(--safe-t)) 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .topbar h1 { font-size: 24px; margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .fab { position: fixed; right: 16px; bottom: calc(24px + var(--safe-b)); z-index: 31; width: 56px; height: 56px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); border: none; box-shadow: var(--shadow-float); display: flex; align-items: center; justify-content: center; transition: transform var(--dur) var(--ease-out); }
    .fab:active { transform: scale(0.96); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px 16px; margin: 0 16px 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--text-2); }
    .small { font-size: 14px; }
    .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--r-pill); font-size: 12px; line-height: 20px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
    .chip .dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
    .chip.tag { background: var(--surface); color: var(--text-2); }
    .chip.warn { background: var(--amber-tint); color: var(--amber); border-color: transparent; }
    .chip.btn { background: var(--surface); border-color: var(--border); color: var(--text); min-height: 32px; padding: 4px 12px; transition: background var(--dur) var(--ease-out); }
    .chip.btn.on { background: var(--accent-tint); color: var(--accent-text); border-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .thumb { width: 48px; height: 64px; object-fit: cover; border-radius: var(--r-control); background: var(--surface-3); border: 1px solid var(--border); flex-shrink: 0; }
    .btn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-control); padding: 10px 16px; min-height: 44px; font-weight: 600; font-size: 16px; transition: background var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); }
    .btn:active { background: var(--surface-2); }
    .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .btn.danger { color: var(--red); border-color: var(--border-strong); }
    .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
    .btn.wide { width: 100%; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: 6px; font-weight: 600; }
    .field label.row { display: flex; align-items: center; min-height: 44px; margin: 0; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; min-height: 44px; border: 1px solid var(--border-strong); border-radius: var(--r-control); background: var(--surface); font-size: 16px; }
    .field textarea { min-height: 88px; resize: vertical; }
    .field.unsure input, .field.unsure select { border-color: var(--amber); }
    .field.unsure { background: var(--amber-tint); margin-left: -8px; margin-right: -8px; padding: 8px 8px 4px; border-radius: var(--r-control); }
    .unsure-note { font-size: 14px; color: var(--amber); margin-top: 4px; }
    .section-h { padding: 16px 16px 8px; font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center; }
    .empty { text-align: center; color: var(--text-2); padding: 64px 24px; font-size: 16px; }
    .search { width: 100%; padding: 10px 12px; min-height: 44px; border-radius: var(--r-control); border: 1px solid var(--border-strong); background: var(--surface); font-size: 16px; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .flabel { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; align-self: center; min-width: 64px; flex-shrink: 0; }
    .sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-bottom: calc(24px + var(--safe-b)); }
    .sheet .topbar { background: var(--bg); }
    .pages { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    .pages img { height: 120px; border-radius: var(--r-control); border: 1px solid var(--border); }
    .pages .add { height: 120px; width: 88px; border-radius: var(--r-control); border: 1px dashed var(--border-strong); background: none; color: var(--text-2); font-size: 14px; }
    .banner { margin: 0 16px 8px; padding: 12px 16px; border-radius: var(--r-card); font-size: 14px; line-height: 1.5; }
    .banner.err { background: var(--red-tint); color: var(--red); }
    .banner.ok { background: var(--green-tint); color: var(--green); }
    .banner.info { background: var(--accent-tint); color: var(--accent-text); }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .spinner.dark { border-color: var(--border-strong); border-top-color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes focusPulse { 0% { transform: scale(1.3); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    .kv { display: grid; grid-template-columns: 112px 1fr; gap: 8px 12px; font-size: 14px; }
    .kv .k { color: var(--text-2); }
    .total-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 14px; color: var(--text-2); }
    .crop-wrap { position: relative; touch-action: none; user-select: none; }
    .crop-wrap img { display: block; width: 100%; height: auto; }
    .handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 22px; background: rgba(255,255,255,0.15); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.4); }
    .handle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 5px; background: #fff; }
    .handle { transform-origin: center; touch-action: none; }
    .handle.edge { width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 8px; background: rgba(255,255,255,0.1); }
    .handle.edge::after { width: 14px; height: 4px; margin: -2px 0 0 -7px; border-radius: 2px; }
    .seg { display: flex; border: 1px solid var(--border-strong); border-radius: var(--r-control); overflow: hidden; }
    .seg button { flex: 1; border: none; background: var(--surface); padding: 10px; min-height: 44px; font-size: 14px; }
    .seg button.on { background: var(--accent); color: var(--on-accent); }
    .sync-dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }
    .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const BUILD_VERSION = '2026-09-09b-demo-mode-design';
    // Last errors are kept on the device so a blank screen can be explained from Settings, Diagnostics.
    const ERR_KEY = 'receipts_errors';
    const logError = (where, e) => {
      try {
        const list = JSON.parse(localStorage.getItem(ERR_KEY) || '[]');
        list.unshift({ t: new Date().toISOString(), where, msg: String(e && e.message || e), stack: String(e && e.stack || '').slice(0, 600), build: BUILD_VERSION, mem: (performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB' : '') });
        localStorage.setItem(ERR_KEY, JSON.stringify(list.slice(0, 20)));
      } catch (_) {}
    };
    window.addEventListener('error', (ev) => logError('window', ev.error || ev.message));
    const crumb = (name) => { try { sessionStorage.setItem('receipts_screen', name + ' @ ' + new Date().toISOString().slice(11, 19)); } catch (_) {} };
    try {
      const last = sessionStorage.getItem('receipts_screen');
      const navType = (performance.getEntriesByType('navigation')[0] || {}).type;
      if (last && navType !== 'navigate') logError('restart', 'App restarted (' + navType + ') while on: ' + last + (performance.memory ? ', heap now ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB' : ''));
      if (last && navType === 'navigate') logError('relaunch', 'App relaunched; last screen was: ' + last);
    } catch (_) {}
    window.addEventListener('unhandledrejection', (ev) => logError('promise', ev.reason));
    // Android Back in an installed PWA closes the app when there is no history. Every sheet registers a close handler
    // and pushes one history entry while open; Back pops it and runs the handler. Closing from a button consumes the
    // entry silently so the stack never drifts.
    const nav = { stack: [], pendingBacks: 0, queue: [], id: 0, session: Math.random().toString(36).slice(2) };
    try { if (history.state && history.state.sheet) history.replaceState(null, ''); } catch (_) {}
    const navFlush = () => { while (nav.queue.length) { const e = nav.queue.shift(); nav.stack.push(e); try { history.pushState({ sheet: e.id, s: nav.session }, ''); } catch (_) {} } };
    window.addEventListener('popstate', () => {
      if (nav.pendingBacks > 0) { nav.pendingBacks--; if (!nav.pendingBacks) navFlush(); return; } // a back we asked for
      const top = nav.stack.pop(); if (top) top.fn(); // the phone's Back: close the topmost sheet
    });
    function useBack(open, onBack) {
      const ref = useRef(onBack); ref.current = onBack;
      useEffect(() => {
        if (!open) return;
        const entry = { id: ++nav.id, fn: () => ref.current() };
        // a push while one of our backs is in flight would be swallowed by that back, so queue it until the back lands
        if (nav.pendingBacks > 0) nav.queue.push(entry); else { nav.stack.push(entry); try { history.pushState({ sheet: entry.id, s: nav.session }, ''); } catch (_) {} }
        return () => {
          const qi = nav.queue.indexOf(entry); if (qi >= 0) { nav.queue.splice(qi, 1); return; }
          const i = nav.stack.indexOf(entry); if (i < 0) return; // already popped by Back
          nav.stack.splice(i, 1);
          // closed from a button: consume our history entry only when it is the one on top
          if (history.state && history.state.sheet === entry.id && history.state.s === nav.session) { nav.pendingBacks++; try { history.back(); } catch (_) { nav.pendingBacks--; } }
        };
      }, [open]);
    }
    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err, info) { logError('render', err); }
      render() {
        if (!this.state.err) return this.props.children;
        return (
          <div style={{ padding: '40px 20px', textAlign: 'center' }}>
            <div style={{ fontSize: 20, fontWeight: 600, marginBottom: 8 }}>Something went wrong</div>
            <div className="small muted" style={{ marginBottom: 16, wordBreak: 'break-word' }}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
            <button className="btn primary" onClick={() => window.location.reload()}>Reload</button>
            <div className="small muted" style={{ marginTop: 12 }}>Your receipts are safe. The error is recorded under Settings, Diagnostics.</div>
          </div>
        );
      }
    }
    const DEFAULT_CATEGORIES = ['Electronics', 'Bills'];
    const DEFAULT_TAGS = ['Warranty', 'Reimbursable'];
    const CATEGORY_COLOURS = ['#2563EB', '#16A34A', '#D97706', '#7C3AED', '#DC2626', '#0891B2', '#A16207', '#64748B'];

    // ---------- Settings (localStorage) ----------
    const DEMO = /[?&]demo\b/.test(location.search);
    const SKEY = DEMO ? 'receipts_settings_demo' : 'receipts_settings';
    const HAS_DARK = true; // the design variant sets this true
    const applyTheme = (t) => { if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
    const loadSettings = () => {
      const base = { apiKey: '', categories: DEFAULT_CATEGORIES.slice(), tags: DEFAULT_TAGS.slice(), currency: 'AUD', enhanceDefault: true, driveConnected: false, driveFolderId: '', lastSync: null, notDuplicates: [], cameraDevice: '' };
      try { const s = JSON.parse(localStorage.getItem(SKEY) || '{}'); return { ...base, ...s }; } catch (_) { return base; }
    };
    const saveSettings = (s) => { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (_) {} };

    // ---------- IndexedDB ----------
    const DB_NAME = DEMO ? 'receipts_demo' : 'receipts_db', DB_VER = 1;
    let dbPromise = null;
    const openDB = () => {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('images')) db.createObjectStore('images', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
      return dbPromise;
    };
    const tx = async (store, mode, fn) => {
      const db = await openDB();
      return new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const s = t.objectStore(store);
        let out;
        try { out = fn(s); } catch (e) { rej(e); return; }
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    };
    const dbGetAll = (store) => tx(store, 'readonly', (s) => s.getAll());
    const dbGet = (store, id) => tx(store, 'readonly', (s) => s.get(id));
    const dbPut = (store, obj) => tx(store, 'readwrite', (s) => s.put(obj));
    const dbDel = (store, id) => tx(store, 'readwrite', (s) => s.delete(id));
    const dbGetImageBlob = async (id) => { const r = await dbGet('images', id); return r ? r.blob : null; };

    const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const fmtDate = (iso) => { if (!iso) return ''; const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : iso; };
    const fmtMoney = (n, cur) => { if (n === null || n === undefined || n === '' || isNaN(+n)) return ''; const v = (+n).toFixed(2); return (cur === 'AUD' || !cur ? '$' : cur + ' ') + v; };
    const parseDate = (txt) => {
      const t = String(txt || '').trim(); if (!t) return null;
      let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = t.match(/^(\d{1,2})[\/.\-\s](\d{1,2})(?:[\/.\-\s](\d{2,4}))?$/);
      if (!m) { const d = t.match(/^(\d{2})(\d{2})(\d{4})$/); if (d) m = [null, d[1], d[2], d[3]]; else { const e = t.match(/^(\d{2})(\d{2})(\d{2})$/); if (e) m = [null, e[1], e[2], e[3]]; } }
      if (!m) return null;
      let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
      const mo = +m[2], d = +m[1]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    };
    const gstOf = (total) => { const t = +total; return isNaN(t) ? null : Math.round(t / 11 * 100) / 100; };
    const monthLabel = (iso) => { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? 'Unknown date' : d.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }); };
    const catColour = (cat, cats) => { const i = Math.max(0, cats.indexOf(cat)); return CATEGORY_COLOURS[i % CATEGORY_COLOURS.length]; };

    // ---------- Image helpers ----------
    const loadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('could not decode image')); im.src = src; });
    const blobToDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
    const canvasToBlob = (c, q = 0.86) => new Promise((res) => c.toBlob(res, 'image/jpeg', q));
    const fileToCanvas = async (file, maxDim = 2000) => {
      let bmp = null;
      try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) {}
      let src = bmp, w, h;
      if (bmp) { w = bmp.width; h = bmp.height; }
      else { const url = URL.createObjectURL(file); src = await loadImage(url); w = src.naturalWidth; h = src.naturalHeight; URL.revokeObjectURL(url); }
      const scale = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');

        canvas.width = 0; canvas.height = 0; // the raw capture is no longer needed
        onDone(blob, enhance);
      };
      crumb(result ? 'crop:result' : 'crop:edit ' + canvas.width + 'x' + canvas.height);
      if (!preview) return <div className="sheet" style={{ background: '#000' }} />;
      const dims = `${canvas.width}x${canvas.height}${canvas.captureHow === 'photo' ? ' still' : ''}`;
      if (result) return (
        <div className="sheet" style={{ background: '#111', color: '#fff', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: 'calc(8px + var(--safe-t)) 16px 4px', fontSize: 12, opacity: 0.7, textAlign: 'center' }}>{(enhance ? result.enhanced : result.colour).width}x{(enhance ? result.enhanced : result.colour).height} · pinch to zoom</div>
          <ZoomPane style={{ flex: 1 }}>
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 12 }}>
              <img src={enhance ? result.enhancedUrl : result.colourUrl} draggable={false} style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', borderRadius: 6 }} />
            </div>
          </ZoomPane>
          <div style={{ padding: '10px 16px calc(20px + var(--safe-b))', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <div className="seg" style={{ borderColor: '#444' }}>
              <button style={{ background: enhance ? '#fff' : '#222', color: enhance ? '#000' : '#fff' }} onClick={() => setEnhance(true)}>Enhanced</button>
              <button style={{ background: !enhance ? '#fff' : '#222', color: !enhance ? '#000' : '#fff' }} onClick={() => setEnhance(false)}>Colour</button>
            </div>
            <div className="row">
              <button className="btn" style={{ background: '#222', color: '#fff', borderColor: '#444' }} onClick={() => setResult(null)}>Adjust crop</button>
              <button className="btn primary grow" onClick={finish} disabled={busy}>{busy ? 'Saving...' : 'Use this page'}</button>
            </div>
          </div>
        </div>
      );
      const hs = 1 / zoom;
      const mids = quad ? quad.map((p, i) => { const n = quad[(i + 1) % 4]; return { x: (p.x + n.x) / 2, y: (p.y + n.y) / 2 }; }) : [];
      return (
        <div className="sheet" style={{ background: '#111', color: '#fff', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: 'calc(10px + var(--safe-t)) 16px 6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
            <button onClick={onRetake} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 16 }}>Retake</button>
            <div style={{ fontSize: 12, opacity: 0.8, textAlign: 'center' }}>{det && det.detected ? 'Edges found. Drag corners or edges.' : 'Drag the corners or edges to the paper.'}<br /><span style={{ opacity: 0.7 }}>{dims} · pinch to zoom, pan away from the screen edge</span></div>
            <div className="row" style={{ gap: 4 }}>
              {det && det.quad && <button onClick={redetect} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 14, opacity: 0.8 }}>Auto</button>}
              <button onClick={reset} style={{ background: 'none', border: 'none', color: '#fff', fontSize: 14, opacity: 0.8 }}>Full</button>
            </div>
          </div>
          <ZoomPane style={{ flex: 1, margin: '0 34px' }} onScale={setZoom}>
            <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '26px 8px' }}>
              <div style={{ position: 'relative', maxWidth: '100%', maxHeight: '100%', aspectRatio: `${canvas.width} / ${canvas.height}`, width: canvas.width >= canvas.height ? '100%' : 'auto', height: canvas.width >= canvas.height ? 'auto' : '100%' }}>
                <img ref={imgRef} src={preview} draggable={false} style={{ width: '100%', height: '100%', display: 'block', userSelect: 'none' }} />
                {quad && <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} viewBox={`0 0 ${canvas.width} ${canvas.height}`} preserveAspectRatio="none">
                  <polygon points={quad.map(p => `${p.x},${p.y}`).join(' ')} fill="rgba(31,58,95,0.18)" stroke="#fff" strokeWidth={Math.max(2, canvas.width / 500) / zoom} vectorEffect="non-scaling-stroke" />
                </svg>}
                {quad && mids.map((m, i) => <div key={'e' + i} className="handle edge" style={{ left: `${m.x / canvas.width * 100}%`, top: `${m.y / canvas.height * 100}%`, transform: `scale(${hs})` }} onPointerDown={startDrag('edge', i)} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} />)}
                {quad && quad.map((p, i) => <div key={'c' + i} className="handle" style={{ left: `${p.x / canvas.width * 100}%`, top: `${p.y / canvas.height * 100}%`, transform: `scale(${hs})` }} onPointerDown={startDrag('corner', i)} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp} />)}
              </div>
            </div>
          </ZoomPane>
          <div style={{ padding: '10px 16px calc(20px + var(--safe-b))' }}>
            <button className="btn primary wide" onClick={apply} disabled={busy}>{busy ? 'Straightening...' : 'Crop and clean up'}</button>
          </div>
        </div>
      );
    }

    // ---------- Duplicates ----------
    const normName = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const nameSim = (a, b) => { const x = normName(a), y = normName(b); if (!x || !y) return false; return x === y || (x.length >= 4 && y.includes(x)) || (y.length >= 4 && x.includes(y)); };
    const dayDiff = (a, b) => { if (!a || !b) return 99; return Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000; };
    const sameTotal = (a, b) => a !== null && a !== undefined && a !== '' && b !== null && b !== undefined && b !== '' && Math.abs(+a - +b) < 0.005;
    const pairKey = (a, b) => [a.id, b.id].sort().join('|');
    // Why two receipts look like the same one, or null
    const duplicateReason = (a, b) => {
      // A matching number counts only with a matching date: account and reference numbers repeat across bills
      const na = normName(a.receiptNo), nb = normName(b.receiptNo);
      if (na && nb && na.length >= 4 && na === nb && a.date && a.date === b.date) return 'Same receipt number and date';
      const merch = nameSim(a.merchant, b.merchant) || nameSim(a.items, b.items);
      const days = dayDiff(a.date, b.date);
      if (sameTotal(a.total, b.total) && days === 0) return merch ? 'Same date, total and merchant' : 'Same date and total';
      if (sameTotal(a.total, b.total) && merch && days <= 1) return 'Same merchant and total, a day apart';
      if (sameTotal(a.total, b.total) && merch && a.date && b.date && a.date.slice(8, 10) === b.date.slice(8, 10) && a.date !== b.date) return 'Same name and total, same day of a different month';
      if (sameTotal(a.total, b.total) && merch && days <= 62) return 'Same name and total within two months';
      const oneMissing = (a.total === null || a.total === undefined || a.total === '') !== (b.total === null || b.total === undefined || b.total === '');
      if (oneMissing && merch && days === 0) return 'Same date and merchant, one has no total';
      return null;
    };
    const findDuplicates = (receipts, ignored) => {
      const ig = new Set(ignored || []); const out = [];
      for (let i = 0; i < receipts.length; i++) for (let j = i + 1; j < receipts.length; j++) {
        const a = receipts[i], b = receipts[j]; if (ig.has(pairKey(a, b))) continue;
        const reason = duplicateReason(a, b); if (reason) out.push({ a, b, reason });
      }
      return out;
    };
    // Merge `drop` into `keep`: keep wins on every filled field, blanks fill from drop, tags union, comments joined, pages appended.
    const mergeReceipts = async (keep, drop) => {
      const has = (v) => v !== null && v !== undefined && v !== '';
      const merged = { ...keep };
      for (const k of ['items', 'merchant', 'date', 'total', 'category', 'currency', 'receiptNo', 'accountNo']) if (!has(keep[k]) && has(drop[k])) merged[k] = drop[k];
      merged.gstIncluded = !!(keep.gstIncluded || drop.gstIncluded);
      merged.tags = Array.from(new Set([...(keep.tags || []), ...(drop.tags || [])]));
      merged.comments = [keep.comments, drop.comments].filter(Boolean).filter((c, i, arr) => arr.indexOf(c) === i).join('\n');
      merged.pages = Array.from(new Set([...(keep.pages || []), ...(drop.pages || [])]));
      merged.needsReview = !!(keep.needsReview || drop.needsReview);
      merged.unsure = Array.from(new Set([...(keep.unsure || []), ...(drop.unsure || [])]));
      merged.createdAt = [keep.createdAt, drop.createdAt].filter(Boolean).sort()[0] || keep.createdAt;
      merged.updatedAt = new Date().toISOString();
      if (!merged.thumb && merged.pages[0]) { const b = await dbGetImageBlob(merged.pages[0]); if (b) merged.thumb = await makeThumb(b); }
      await dbPut('receipts', merged); await dbDel('receipts', drop.id);
      return merged;
    };
    const deleteReceiptFully = async (r) => { for (const id of r.pages || []) await dbDel('images', id); await dbDel('receipts', r.id); };
    function DupCard({ r, cats, label, onView, onEdit, onReread, reading, busyAny }) {
      const col = catColour(r.category, cats);
      return (
        <div className="card grow" style={{ margin: 0, padding: 10 }}>
          <div className="small muted" style={{ marginBottom: 6, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</div>
          {r.thumb ? <div onClick={onView} style={{ cursor: 'pointer' }}><img src={r.thumb} style={{ width: '100%', maxHeight: 160, objectFit: 'contain', borderRadius: 8, background: 'var(--surface-3)' }} /><div className="small muted" style={{ textAlign: 'center' }}>Tap to view{(r.pages || []).length > 1 ? ` ${r.pages.length} pages` : ''}</div></div> : <div className="muted small" style={{ height: 40 }}>no image</div>}
          <div style={{ fontWeight: 600, marginTop: 6 }}>{r.items || r.merchant || 'Receipt'}</div>
          <div className="small muted">{r.items ? r.merchant : ''}</div>
          <div className="small">{fmtDate(r.date) || 'No date'} · <span className="amt">{fmtMoney(r.total, r.currency) || 'No total'}</span>{r.receiptNo ? <span className="muted"> · #{r.receiptNo}</span> : null}</div>
          <div className="chips" style={{ marginTop: 4 }}>{r.category && <span className="chip"><span className="dot" style={{ background: col }} />{r.category}</span>}{(r.tags || []).map(t => <span key={t} className="chip tag">#{t}</span>)}{(r.pages || []).length > 0 && <span className="chip" style={{ background: 'var(--surface-3)', color: 'var(--text-2)' }}>{r.pages.length} page{r.pages.length === 1 ? '' : 's'}</span>}</div>
          {r.comments && <div className="small muted" style={{ marginTop: 4, whiteSpace: 'pre-wrap' }}>{r.comments}</div>}
          <div className="row" style={{ marginTop: 8, gap: 6 }}>
            <button className="chip btn" onClick={onEdit}>Edit</button>
            {(r.pages || []).length > 0 && <button className="chip btn" disabled={!!reading || busyAny} onClick={onReread}>{reading ? 'AI reading...' : 'AI re-analyse'}</button>}
          </div>
        </div>
      );
    }
    // Reviews a list of pairs one at a time. onResolved(kind, survivor) is called after each action; onClose when done.
    function DuplicateReview({ pairs: livePairs, settings, setSettings, onResolved, onClose, newId, onEdited }) {
      // The list of pairs changes underneath us after every merge or delete (the parent recomputes it), so work from the
      // list as it was when the page opened, and skip any pair whose receipts have since gone.
      const [pairs] = useState(() => livePairs.slice());
      const [gone, setGone] = useState(() => new Set());
      const [i, setI] = useState(0); const [busy, setBusy] = useState(false);
      const [over, setOver] = useState({}); // id -> receipt as edited here
      const [edit, setEdit] = useState(null); // { r, draft, pages }
      const [reading, setReading] = useState(null);
      useBack(!!edit, () => setEdit(null));
      const live = (r) => over[r.id] || r;
      const readingRef = useRef(null);
      const openEdit = async (r, draft) => {
        const pages = []; for (const pid of r.pages || []) { const b = await dbGetImageBlob(pid); if (b) pages.push({ id: pid, blob: b, url: URL.createObjectURL(b) }); }
        setEdit({ r, pages, stamp: Date.now(), draft: draft || { ...r, total: r.total ?? '', gstIncluded: !!r.gstIncluded, tags: r.tags || [] } });
      };
      const reread = async (r) => {
        if (!(r.pages || []).length || readingRef.current) return; // one at a time
        readingRef.current = r.id; setReading(r.id);
        try {
          const blobs = []; for (const pid of r.pages) { const b = await dbGetImageBlob(pid); if (b) blobs.push(b); }
          const data = await extractPages(blobs, settings);
          if (readingRef.current === r.id) await openEdit(r, { ...draftFromExtraction(data, settings, r), total: undefined });
        } catch (e) { alert(extractErrMsg(e)); }
        readingRef.current = null; setReading(null);
      };
      const saveEdit = async (rec) => {
        const full = { ...edit.r, ...rec, id: edit.r.id, pages: edit.r.pages, thumb: edit.r.thumb, updatedAt: new Date().toISOString() };
        await dbPut('receipts', full); setOver(o => ({ ...o, [full.id]: full })); if (onEdited) onEdited(full);
        edit.pages.forEach(p => URL.revokeObjectURL(p.url)); setEdit(null);
      };
      const [viewer, setViewer] = useState(null); // { urls, names }
      useBack(!!viewer, () => setViewer(null));
      useEffect(() => () => { if (viewer) viewer.urls.forEach(u => URL.revokeObjectURL(u)); }, [viewer]);
      const view = async (r) => {
        const urls = [], names = [];
        for (const [k, pid] of (r.pages || []).entries()) { const b = await dbGetImageBlob(pid); if (b) { urls.push(URL.createObjectURL(b)); names.push(pageFileName(r, k, pid)); } }
        if (urls.length) setViewer({ urls, names });
      };
      const valid = (k) => k < pairs.length && !gone.has(pairs[k].a.id) && !gone.has(pairs[k].b.id);
      const firstValidFrom = (k) => { while (k < pairs.length && !valid(k)) k++; return k; };
      const cur = firstValidFrom(i);
      const pair = cur < pairs.length ? pairs[cur] : null;
      const remaining = pairs.filter((_, k) => k >= cur && valid(k)).length;
      const next = () => { const n = firstValidFrom(cur + 1); if (n < pairs.length) setI(n); else onClose(); };
      const act = async (fn) => { setBusy(true); try { await fn(); } catch (e) { alert(e.message); logError('duplicates', e); } setBusy(false); next(); };
      useEffect(() => { if (!pair) onClose(); }, [pair]);
      if (!pair) return <div className="sheet"><div className="empty">All duplicates handled.</div></div>;
      if (edit) { const d = edit.draft; if (d.total === undefined) d.total = edit.r.total ?? ''; return <ReceiptForm key={'dup-' + edit.r.id + '-' + edit.stamp} draft={d} pages={edit.pages} settings={settings} setSettings={setSettings} onSave={saveEdit} onCancel={() => { edit.pages.forEach(p => URL.revokeObjectURL(p.url)); setEdit(null); }} title="Edit this entry" />; }
      // For a fresh capture, show the new one on the right and prefer merging into the existing one on the left
      const left = live(newId && pair.a.id === newId ? pair.b : pair.a), right = live(newId && pair.a.id === newId ? pair.a : pair.b);
      const leftLabel = newId ? 'Existing' : 'A', rightLabel = newId ? 'Just added' : 'B';
      return (
        <div className="sheet" style={{ zIndex: 45 }}>
          {viewer && <ImageViewer urls={viewer.urls} names={viewer.names} start={0} onClose={() => setViewer(null)} />}
          <div className="topbar"><button className="btn" onClick={onClose}>Close</button><h1 style={{ fontSize: 20 }}>Possible duplicate{remaining > 1 ? ` (${remaining} left)` : ''}</h1><span style={{ width: 70 }} /></div>
          <div className="banner info">{pair.reason}.</div>
          <div className="row" style={{ alignItems: 'stretch', padding: '0 16px 12px', gap: 8 }}><DupCard r={left} cats={settings.categories} label={leftLabel} onView={() => view(left)} onEdit={() => openEdit(left)} onReread={() => reread(left)} reading={reading === left.id} busyAny={!!reading} /><DupCard r={right} cats={settings.categories} label={rightLabel} onView={() => view(right)} onEdit={() => openEdit(right)} onReread={() => reread(right)} reading={reading === right.id} busyAny={!!reading} /></div>
          <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div className="small muted" style={{ textAlign: 'center' }}>Merge keeps every page, tag and note from both. The side you merge into wins where the two disagree.</div>
            <div className="row">
              <button className="btn primary grow" disabled={busy} onClick={() => act(async () => { const m = await mergeReceipts(left, right); setGone(g => new Set([...g, right.id])); setOver(o => ({ ...o, [m.id]: m })); onResolved('merged', m, right.id); })}>Merge into {leftLabel.toLowerCase()}</button>
              <button className="btn primary grow" disabled={busy} onClick={() => act(async () => { const m = await mergeReceipts(right, left); setGone(g => new Set([...g, left.id])); setOver(o => ({ ...o, [m.id]: m })); onResolved('merged', m, left.id); })}>Merge into {rightLabel.toLowerCase()}</button>
            </div>
            <div className="row">
              <button className="btn grow" disabled={busy} onClick={() => act(async () => { await deleteReceiptFully(right); setGone(g => new Set([...g, right.id])); onResolved('deleted', left, right.id); })}>Keep {leftLabel.toLowerCase()}, delete {rightLabel.toLowerCase()}</button>
              <button className="btn grow" disabled={busy} onClick={() => act(async () => { await deleteReceiptFully(left); setGone(g => new Set([...g, left.id])); onResolved('deleted', right, left.id); })}>Keep {rightLabel.toLowerCase()}, delete {leftLabel.toLowerCase()}</button>
            </div>
            <button className="btn wide" disabled={busy} onClick={() => act(async () => { setSettings(s => ({ ...s, notDuplicates: [...(s.notDuplicates || []), pairKey(left, right)] })); onResolved('kept', null, null); })}>Keep both, not a duplicate</button>
            {remaining > 1 && <button className="btn wide" disabled={busy} style={{ border: 'none', background: 'none' }} onClick={next}>Decide later</button>}
          </div>
        </div>
      );
    }

    // ---------- Bulk re-read review: old vs proposed, one receipt at a time ----------
    const FIELDS = [['items', 'Item'], ['merchant', 'Merchant'], ['date', 'Date'], ['total', 'Total'], ['gstIncluded', 'GST'], ['category', 'Category'], ['tags', 'Tags'], ['receiptNo', 'Receipt no.'], ['accountNo', 'Account no.'], ['comments', 'Comments']];
    const showVal = (k, v, cur) => { if (k === 'date') return fmtDate(v) || ''; if (k === 'total') return fmtMoney(v, cur) || ''; if (k === 'gstIncluded') return v ? 'Included' : 'Not included'; if (k === 'tags') return (v || []).map(t => '#' + t).join(' '); return v || ''; };
    const sameVal = (k, a, b) => {
      if (k === 'tags') return (a || []).join('|') === (b || []).join('|');
      if (k === 'gstIncluded') return !!a === !!b;
      if (k === 'total') { const ea = a === null || a === undefined || a === '', eb = b === null || b === undefined || b === ''; return ea && eb ? true : (!ea && !eb && Math.abs(+a - +b) < 0.005); }
      return (a || '') === (b || '');
    };
    function BulkReview({ review, setReview, settings, setSettings, onApply, onDone }) {
      const { items, i } = review; const item = items[i];
      const [edit, setEdit] = useState(null); const [busy, setBusy] = useState(false);
      useBack(!!edit, () => setEdit(null));
      const next = () => { const n = items.findIndex((x, k) => k > i && x.status === 'pending'); if (n >= 0) setReview({ items, i: n }); else { const first = items.findIndex(x => x.status === 'pending'); if (first >= 0) setReview({ items, i: first }); else onDone(); } };
      const act = async (fn) => { setBusy(true); try { await fn(); } catch (e) { alert(e.message); } setBusy(false); next(); };
      const accept = () => act(() => onApply(item, item.after));
      const keep = () => act(async () => { item.status = 'kept'; });
      const acceptAll = () => act(async () => { for (const it of items) if (it.status === 'pending') await onApply(it, it.after); });
      const openEdit = async () => { const pages = []; for (const pid of item.before.pages || []) { const b = await dbGetImageBlob(pid); if (b) pages.push({ id: pid, blob: b, url: URL.createObjectURL(b) }); } setEdit({ pages, draft: { ...item.after, total: item.after.total ?? '', gstIncluded: !!item.after.gstIncluded, tags: item.after.tags || [] } }); };
      useEffect(() => { if (!item) onDone(); }, [item]);
      if (!item) return <div className="sheet"><div className="empty">All done.</div></div>;
      if (edit) return <ReceiptForm key={'bulk-' + item.before.id} draft={edit.draft} pages={edit.pages} settings={settings} setSettings={setSettings} title="Adjust and save" onSave={async (rec) => { const full = { ...item.before, ...rec, id: item.before.id, pages: item.before.pages, thumb: item.before.thumb }; edit.pages.forEach(p => URL.revokeObjectURL(p.url)); setEdit(null); await act(() => onApply(item, full)); }} onCancel={() => { edit.pages.forEach(p => URL.revokeObjectURL(p.url)); setEdit(null); }} />;
      const pending = items.filter(x => x.status === 'pending').length;
      const changed = FIELDS.filter(([k]) => !sameVal(k, item.before[k], item.after[k]));
      return (
        <div className="sheet" style={{ zIndex: 45 }}>
          <div className="topbar"><button className="btn" onClick={onDone}>Close</button><h1 style={{ fontSize: 20 }}>AI re-analysis {i + 1} of {items.length}</h1><span style={{ width: 70 }} /></div>
          <div className="banner info">{changed.length ? `${changed.length} field${changed.length === 1 ? '' : 's'} would change. Nothing is saved until you accept.` : 'The AI read the same values. Nothing to change.'}{(item.after.unsure || []).length ? ` Unsure: ${item.after.unsure.join(', ')}.` : ''}</div>
          <div className="card">
            <div className="row" style={{ gap: 10, alignItems: 'flex-start' }}>
              {item.before.thumb && <img src={item.before.thumb} className="thumb" style={{ width: 70, height: 90 }} />}
              <div className="grow" style={{ display: 'grid', gridTemplateColumns: '84px 1fr 1fr', gap: '6px 8px', fontSize: 14 }}>
                <span /><span className="small muted" style={{ fontWeight: 600, textTransform: 'uppercase' }}>Now</span><span className="small muted" style={{ fontWeight: 600, textTransform: 'uppercase' }}>AI read</span>
                {FIELDS.map(([k, label]) => { const diff = !sameVal(k, item.before[k], item.after[k]); return (
                  <React.Fragment key={k}>
                    <span className="muted small" style={{ paddingTop: 2 }}>{label}</span>
                    <span style={{ opacity: diff ? 0.6 : 1, textDecoration: diff ? 'line-through' : 'none', wordBreak: 'break-word' }}>{showVal(k, item.before[k], item.before.currency)}</span>
                    <span style={{ fontWeight: diff ? 700 : 400, color: diff ? 'var(--navy)' : 'inherit', background: diff ? 'var(--navy-soft)' : 'none', borderRadius: 4, padding: diff ? '0 4px' : 0, wordBreak: 'break-word' }}>{showVal(k, item.after[k], item.after.currency)}</span>
                  </React.Fragment>); })}
              </div>
            </div>
          </div>
          <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button className="btn primary wide" disabled={busy} onClick={accept}>Accept these values</button>
            <div className="row"><button className="btn grow" disabled={busy} onClick={keep}>Keep what I have</button><button className="btn grow" disabled={busy} onClick={openEdit}>Edit before saving</button></div>
            {pending > 1 && <button className="btn wide" disabled={busy} style={{ border: 'none', background: 'none' }} onClick={acceptAll}>Accept all {pending} remaining</button>}
          </div>
        </div>
      );
    }

    // ---------- Demo data (only when the URL carries ?demo; lives in its own database) ----------
    const drawSampleReceipt = (kind) => {

    const seedDemo = async () => {

      const jb = await mk('jb'), agl = await mk('agl'), agl2 = await mk('agl');

    // ---------- Capture flow: camera -> crop -> (more pages) -> extract -> review form ----------
    function CaptureFlow({ settings, setSettings, onSaved, onCancel, existing, receipts }) {
      // existing: receipt being edited to add pages to (optional)
      const [stage, setStage] = useState('choose'); // choose | camera | crop | pages | extracting | review
      useBack(stage !== 'choose', () => {
        if (stage === 'camera') setStage(pages.length ? 'pages' : 'choose');
        else if (stage === 'crop') { setRawCanvas(null); setStage('camera'); }
        else if (stage === 'review' || stage === 'pages' || stage === 'dup') setStage(pages.length ? 'pages' : 'choose');
        else setStage('choose');
      });
      const fileRef = useRef(null);
      const [rawCanvas, setRawCanvas] = useState(null);
      const [pages, setPages] = useState([]); // [{id, blob, url}]
      const [err, setErr] = useState(null);
      const [draft, setDraft] = useState(null);
      const onCapture = (canvas) => { setRawCanvas(canvas); setStage('crop'); };
      const onPick = async (file) => { try { const c = await fileToCanvas(file, 3200); setRawCanvas(c); setStage('crop'); } catch (e) { setErr('Could not read that image.'); setStage('pages'); } };
      const onCropDone = async (blob) => {
        const id = uid(); const url = URL.createObjectURL(blob);
        setPages(p => [...p, { id, blob, url }]); setRawCanvas(null); setStage('pages');
      };
      const removePage = (id) => setPages(p => p.filter(x => x.id !== id));
      const runExtract = async () => {
        setStage('extracting'); setErr(null);
        let data = null;
        try { data = await extractPages(pages.map(p => p.blob), settings); } catch (e) { setErr(extractErrMsg(e)); }
        setDraft(draftFromExtraction(data, settings, null));
        setStage('review');
      };
      const save = async (rec) => {
        for (const p of pages) await dbPut('images', { id: p.id, blob: p.blob });
        const thumb = pages.length ? await makeThumb(pages[0].blob) : null;
        const full = { ...rec, pages: pages.map(p => p.id), thumb, updatedAt: new Date().toISOString() };
        await dbPut('receipts', full);
        pages.forEach(p => URL.revokeObjectURL(p.url));
        const dups = findDuplicates([...(receipts || []).filter(r => r.id !== full.id), full], settings.notDuplicates).filter(d => d.a.id === full.id || d.b.id === full.id);
        if (dups.length) { setDupState({ pairs: dups, saved: full }); setStage('dup'); return; }
        onSaved(full);
      };
      const [dupState, setDupState] = useState(null);
      const dupRef = useRef(null); // the latest survivor, read on close (state would be stale inside the close handler)
      const skipExtract = () => { setDraft({ id: uid(), merchant: '', date: todayISO(), total: '', gstIncluded: false, currency: settings.currency, category: '', tags: [], comments: '', items: '', unsure: [], needsReview: false, createdAt: new Date().toISOString() }); setStage('review'); };
      if (stage === 'dup' && !dupState) { setStage('review'); }
      if (stage === 'dup' && dupState) return <DuplicateReview pairs={dupState.pairs} newId={dupState.saved.id} settings={settings} setSettings={setSettings} onResolved={(kind, survivor, removedId) => { dupRef.current = survivor ? { saved: survivor, removedId } : { saved: dupState.saved, removedId: null }; }} onClose={() => { const d = dupRef.current || { saved: dupState.saved, removedId: null }; onSaved(d.saved, d.removedId); }} onEdited={(full) => { if (full.id === dupState.saved.id) { dupRef.current = { ...(dupRef.current || { removedId: null }), saved: full }; setDupState(ds => ({ ...ds, saved: full })); } }} />;
      crumb('capture:' + stage);
      if (stage === 'choose') return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Cancel</button><h1 style={{ fontSize: 20 }}>New receipt</h1><span style={{ width: 70 }} /></div>
          <div style={{ padding: '8px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button className="btn primary wide" style={{ padding: 16 }} onClick={() => setStage('camera')}>Take a photo</button>
            <button className="btn wide" style={{ padding: 16 }} onClick={() => fileRef.current && fileRef.current.click()}>Choose from gallery</button>
            <input ref={fileRef} type="file" accept="image/*" hidden onChange={e => e.target.files[0] && onPick(e.target.files[0])} />
            <button className="btn wide" style={{ padding: 16 }} onClick={skipExtract}>No image, enter details</button>
            <div className="small muted" style={{ textAlign: 'center' }}>Pages can be added later from the receipt.</div>
          </div>
        </div>
      );
      if (stage === 'camera') return <InAppCamera pageNo={pages.length + 1} onCapture={onCapture} onPick={onPick} onCancel={() => pages.length ? setStage('pages') : setStage('choose')} settings={settings} setSettings={setSettings} />;
      if (stage === 'crop' && rawCanvas) return <CropEditor canvas={rawCanvas} enhanceDefault={settings.enhanceDefault} onDone={onCropDone} onRetake={() => { setRawCanvas(null); setStage('camera'); }} />;
      if (stage === 'extracting') return (
        <div className="sheet" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 14 }}>
          <div className="spinner dark" /><div className="muted">Reading the receipt...</div>
        </div>
      );
      if (stage === 'review' && draft) return <ReceiptForm key={'new-' + draft.id} draft={draft} pages={pages} settings={settings} setSettings={setSettings} error={err} onSave={save} onCancel={() => pages.length ? setStage('pages') : setStage('choose')} onAddPage={() => setStage('camera')} onRemovePage={removePage} title="Check the details" />;
      return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Cancel</button><h1>Pages</h1><span style={{ width: 70 }} /></div>
          {err && <div className="banner err">{err}</div>}
          <div className="card">
            <div className="pages">
              {pages.map((p, i) => (
                <div key={p.id} style={{ position: 'relative' }}>
                  <img src={p.url} />
                  <div className="small" style={{ textAlign: 'center' }}>Page {i + 1}</div>
                  <button onClick={() => removePage(p.id)} style={{ position: 'absolute', top: -6, right: -6, width: 24, height: 24, borderRadius: 12, background: var_red(), color: '#fff', border: 'none', fontSize: 14, lineHeight: 1 }}>x</button>
                </div>
              ))}
              <button className="add" onClick={() => setStage('camera')}>+ Add page</button>
            </div>
          </div>
          <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            <button className="btn primary wide" disabled={!pages.length} onClick={runExtract}>AI analyse receipt</button>
            <button className="btn wide" onClick={skipExtract}>Enter details by hand</button>
          </div>
        </div>
      );
    }
    const var_red = () => 'var(--red)';

    // ---------- Receipt form (used for new and edit) ----------
    function DateField({ value, onChange, placeholder }) {
      const [text, setText] = useState(fmtDate(value));
      useEffect(() => { setText(fmtDate(value)); }, [value]);
      const pickRef = useRef(null);
      const commit = () => { const t = text.trim(); if (!t) { onChange(''); return; } const iso = parseDate(t); if (iso) onChange(iso); else setText(fmtDate(value)); };
      const openPicker = () => { const el = pickRef.current; if (!el) return; try { if (el.showPicker) el.showPicker(); else el.click(); } catch (_) { el.click(); } };
      return (
        <div className="row" style={{ position: 'relative', gap: 6 }}>
          <input className="grow" inputMode="numeric" placeholder={placeholder || 'dd/mm/yyyy'} value={text} onChange={e => setText(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); e.target.blur(); } }} />
          <button type="button" className="btn" style={{ padding: '0 16px', minWidth: 44 }} onClick={openPicker} aria-label="Pick a date"><svg className="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
          <input ref={pickRef} type="date" value={value || ''} onChange={e => onChange(e.target.value)} tabIndex={-1} style={{ position: 'absolute', right: 0, bottom: 0, width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />
        </div>
      );
    }
    function ChipPicker({ options, value, onChange, multi, onAdd, addLabel }) {
      const [adding, setAdding] = useState(false); const [txt, setTxt] = useState('');
      const selected = multi ? (value || []) : (value ? [value] : []);
      const toggle = (o) => { if (multi) onChange(selected.includes(o) ? selected.filter(x => x !== o) : [...selected, o]); else onChange(value === o ? '' : o); };
      const commit = () => { const t = txt.trim(); if (t) { onAdd(t); if (multi) onChange([...selected, t]); else onChange(t); } setTxt(''); setAdding(false); };
      return (
        <div className="chips">
          {options.map(o => <button key={o} type="button" className={'chip btn' + (selected.includes(o) ? ' on' : '')} onClick={() => toggle(o)}>{multi ? '#' : ''}{o}</button>)}
          {adding ? (
            <span className="row" style={{ gap: 4 }}>
              <input autoFocus style={{ padding: '4px 8px', borderRadius: 999, border: '1px solid var(--line)', width: 130, fontSize: 14 }} value={txt} onChange={e => setTxt(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } if (e.key === 'Escape') setAdding(false); }} onBlur={commit} placeholder={addLabel} />
            </span>
          ) : <button type="button" className="chip btn" style={{ borderStyle: 'dashed' }} onClick={() => setAdding(true)}>+ New</button>}
        </div>
      );
    }
    function ReceiptForm({ draft, pages, settings, setSettings, error, onSave, onCancel, onAddPage, onRemovePage, title, onDelete }) {
      const [r, setR] = useState(draft);
      const [saving, setSaving] = useState(false);
      const [armed, setArmed] = useState(false);
      const set = (k, v) => setR(x => ({ ...x, [k]: v, unsure: (x.unsure || []).filter(f => f !== k) }));
      const unsure = (k) => (r.unsure || []).includes(k);
      const addCat = (c) => { if (!settings.categories.includes(c)) setSettings(s => ({ ...s, categories: [...s.categories, c] })); };
      const addTag = (t) => { if (!settings.tags.includes(t)) setSettings(s => ({ ...s, tags: [...s.tags, t] })); };
      const doSave = async () => {
        setSaving(true);
        const out = { ...r, total: r.total === '' ? null : +r.total, gst: r.gstIncluded ? gstOf(r.total) : null, needsReview: (r.unsure || []).length > 0 };
        try { await onSave(out); } catch (e) { setSaving(false); alert('Save failed: ' + e.message); }
      };
      useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 3000); return () => clearTimeout(t); }, [armed]);
      const Note = ({ k }) => unsure(k) ? <div className="unsure-note">Check this</div> : null;
      return (
        <div className="sheet">
          <div className="topbar"><button className="btn" onClick={onCancel}>Back</button><h1 style={{ fontSize: 20 }}>{title}</h1><button className="btn primary" onClick={doSave} disabled={saving}>{saving ? '...' : 'Save'}</button></div>
          {error && <div className="banner err">{error}</div>}
          {(r.unsure || []).length > 0 && <div className="banner" style={{ background: 'var(--amber-soft)', color: 'var(--amber)' }}>Highlighted fields need a check. They were faint, missing, or a guess.</div>}
          <div className="card">
            <div className="pages">
              {pages.map((p) => (
                <div key={p.id} style={{ position: 'relative' }}>
                  <img src={p.url} />
                  {onRemovePage && <button onClick={() => onRemovePage(p.id)} style={{ position: 'absolute', top: -6, right: -6, width: 24, height: 24, borderRadius: 12, background: 'var(--red)', color: '#fff', border: 'none', fontSize: 14, lineHeight: 1 }}>x</button>}
                </div>
              ))}
              {onAddPage && <button className="add" onClick={onAddPage}>+ Add page</button>}
            </div>
          </div>
          <div className="card">
            <div className="field"><label>Item</label><input value={r.items || ''} onChange={e => set('items', e.target.value)} placeholder="What was bought" /></div>
            <div className={'field' + (unsure('merchant') ? ' unsure' : '')}><label>Merchant</label><input value={r.merchant} onChange={e => set('merchant', e.target.value)} placeholder="e.g. JB Hi-Fi" /><Note k="merchant" /></div>
            <div className="row" style={{ alignItems: 'flex-start' }}>
              <div className={'field grow' + (unsure('date') ? ' unsure' : '')}><label>Date</label><DateField value={r.date} onChange={v => set('date', v)} /><Note k="date" /></div>
              <div className={'field' + (unsure('total') ? ' unsure' : '')} style={{ width: 130 }}><label>Total ({r.currency})</label><input type="number" inputMode="decimal" step="0.01" value={r.total} onChange={e => set('total', e.target.value)} placeholder="0.00" /><Note k="total" /></div>
            </div>
            <div className="field">
              <label className="row" style={{ justifyContent: 'space-between', textTransform: 'none', letterSpacing: 0, fontSize: 16, fontWeight: 400, color: 'var(--ink)', cursor: 'pointer' }}>
                <span>GST included{r.gstIncluded && r.total !== '' ? <span className="muted small"> ({fmtMoney(gstOf(r.total), r.currency)})</span> : null}</span>
                <input type="checkbox" checked={!!r.gstIncluded} onChange={e => set('gstIncluded', e.target.checked)} style={{ width: 22, height: 22 }} />
              </label>
            </div>
            <div className={'field' + (unsure('category') ? ' unsure' : '')}>
              <label>Category (pick one)</label>
              <ChipPicker options={settings.categories} value={r.category} onChange={v => set('category', v)} onAdd={addCat} addLabel="New category" />
              <Note k="category" />
            </div>
            <div className="field">
              <label>Tags (pick any)</label>
              <ChipPicker multi options={settings.tags} value={r.tags} onChange={v => set('tags', v)} onAdd={addTag} addLabel="New tag" />
            </div>
            <div className="row">
              <div className="field grow"><label>Receipt or invoice no.</label><input value={r.receiptNo || ''} onChange={e => set('receiptNo', e.target.value)} placeholder="This document only" /></div>
              <div className="field grow"><label>Account no.</label><input value={r.accountNo || ''} onChange={e => set('accountNo', e.target.value)} placeholder="Repeats every bill" /></div>
            </div>
            <div className="field"><label>Comments</label><textarea value={r.comments || ''} onChange={e => set('comments', e.target.value)} placeholder="Warranty period, who to claim from, anything else" /></div>
            <div className="row" style={{ justifyContent: 'space-between' }}><span className="small muted">Currency</span><input value={r.currency} onChange={e => set('currency', e.target.value.toUpperCase())} maxLength={3} style={{ width: 64, padding: '6px', borderRadius: 8, border: '1px solid var(--line)', textAlign: 'center' }} /></div>
          </div>
          {onDelete && <div style={{ padding: '0 16px 20px' }}><button className={'btn wide danger' + (armed ? ' armed' : '')} onClick={() => armed ? onDelete() : setArmed(true)}>{armed ? 'Tap again to delete' : 'Delete receipt'}</button></div>}
        </div>
      );
    }

    // ---------- Image viewer ----------

    // ---------- Receipt detail (view + edit) ----------
    function ReceiptDetail({ receipt, settings, setSettings, onClose, onChanged, onDeleted }) {
      const [pages, setPages] = useState([]);
      const [editing, setEditing] = useState(false);
      const [viewer, setViewer] = useState(null);
      const [adding, setAdding] = useState(false);
      const [rescan, setRescan] = useState(null); const [reading, setReading] = useState(false); const [readErr, setReadErr] = useState(null);
      useBack(editing, () => setEditing(false));
      useBack(viewer !== null, () => setViewer(null));
      useBack(adding, () => setAdding(false));
      useBack(!!rescan, () => setRescan(null));
      const reread = async () => {
        if (!pages.length || reading) return; setReading(true); setReadErr(null);
        const forId = receipt.id;
        try { const data = await extractPages(pages.map(p => p.blob), settings); if (forId === receipt.id) setRescan({ ...draftFromExtraction(data, settings, receipt), stamp: Date.now() }); }
        catch (e) { setReadErr(extractErrMsg(e)); }
        setReading(false);
      };
      useEffect(() => {
        let urls = [];
        (async () => { const out = []; for (const id of receipt.pages || []) { const b = await dbGetImageBlob(id); if (b) { const url = URL.createObjectURL(b); urls.push(url); out.push({ id, blob: b, url }); } } setPages(out); })();
        return () => urls.forEach(u => URL.revokeObjectURL(u));
      }, [receipt.pages]);
      const save = async (rec) => { const full = { ...receipt, ...rec, updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); setEditing(false); };
      useEffect(() => { (async () => { const first = (receipt.pages || [])[0]; if (!first && receipt.thumb) { const full = { ...receipt, thumb: null }; await dbPut('receipts', full); onChanged(full); } else if (first && !receipt.thumb) { const b = await dbGetImageBlob(first); if (b) { const full = { ...receipt, thumb: await makeThumb(b) }; await dbPut('receipts', full); onChanged(full); } } })(); }, [receipt.pages]);
      const del = async () => { for (const id of receipt.pages || []) await dbDel('images', id); await dbDel('receipts', receipt.id); onDeleted(receipt.id); };
      const removePage = async (id) => { await dbDel('images', id); const rest = (receipt.pages || []).filter(p => p !== id); const full = { ...receipt, pages: rest, updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); };
      const addPageDone = async (blob) => { const id = uid(); await dbPut('images', { id, blob }); const full = { ...receipt, pages: [...(receipt.pages || []), id], updatedAt: new Date().toISOString() }; await dbPut('receipts', full); onChanged(full); setAdding(false); };
      if (adding) return <AddPageFlow settings={settings} setSettings={setSettings} onDone={addPageDone} onCancel={() => setAdding(false)} />;
      if (rescan) return <ReceiptForm key={'rescan-' + receipt.id + '-' + rescan.stamp} draft={{ ...rescan, total: rescan.total ?? '' }} pages={pages} settings={settings} setSettings={setSettings} onSave={async (rec) => { await save(rec); setRescan(null); }} onCancel={() => setRescan(null)} title="Check the AI re-analysis" />;
      if (editing) return <ReceiptForm key={'edit-' + receipt.id} draft={{ ...receipt, total: receipt.total ?? '', gstIncluded: !!receipt.gstIncluded, tags: receipt.tags || [] }} pages={pages} settings={settings} setSettings={setSettings} onSave={save} onCancel={() => setEditing(false)} onRemovePage={removePage} onAddPage={() => { setEditing(false); setAdding(true); }} title="Edit receipt" onDelete={del} />;
      const col = catColour(receipt.category, settings.categories);
      return (
        <div className="sheet">
          {viewer !== null && <ImageViewer urls={pages.map(p => p.url)} names={pages.map((p, i) => pageFileName(receipt, i, p.id))} start={viewer} onClose={() => setViewer(null)} />}
          <div className="topbar"><button className="btn" onClick={onClose}>Back</button><h1 style={{ fontSize: 20 }}>Receipt</h1><button className="btn" onClick={() => setEditing(true)}>Edit</button></div>
